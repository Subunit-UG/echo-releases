name: build

# Baut + signiert Echo für alle Plattformen und published das Release HIER (public
# echo-releases) — der Quellcode liegt PRIVAT in Subunit-UG/echo-app (bis 30.10.2026
# subunit-ai/echo-tauri, gleiche Repo-ID 1250598832) und wird per
# read-only Deploy-Key (Secret ECHO_TAURI_DEPLOY_KEY) ausgecheckt. Weil der
# Build in einem PUBLIC Repo läuft, sind die Runner-Minuten GRATIS (auch macOS +
# windows-11-arm) → KEIN Billing. Genau darum liegt der Build hier statt im privaten
# echo-tauri: dort würden private-Repo-Minuten anfallen. [[repo-public-only-for-ci]]
#
# Anstoß auf DREI Wegen (bewusst KEIN Trigger im privaten Repo — das bräuchte
# private Minuten):
#   • schedule (Poller) — prüft alle 15 min, ob echo-tauri einen neuen Stable-Tag
#     hat, der hier noch kein published Release ist, und baut ihn. So bleibt TJs
#     Ablauf „Version taggen + pushen" unverändert, ohne dass echo-tauri eine Action
#     laufen lassen muss.
#   • workflow_dispatch — sofortiger manueller Lauf (Quell-Ref + optionales Label).
#   • repository_dispatch (type: build-release) — für externe Auslöser.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Source tag; draft_stable requires exact 40-character source commit"
        required: true
      release_tag:
        description: "Release-Label hier in echo-releases (leer = wie source_ref)"
        required: false
      release_mode:
        description: "Publish stable, or hold signed RC/stable draft without changing Latest"
        required: true
        default: stable
        type: choice
        options:
          - stable
          - draft_rc
          - draft_stable
  repository_dispatch:
    types: [build-release]

# Ein Release-Build umfasst Reservierung, vier Plattform-Uploads und das atomare
# Publish. Alle Trigger teilen absichtlich EIN Schloss: startet der Poller kurz
# nach einem manuellen Lauf, wartet er bis zum Publish und erkennt den Tag danach
# im prepare-Job als bereits veröffentlichten No-op. Ein nur am reserve-Job
# gesetztes Tag-Schloss reicht nicht, weil die parallelen Matrix-Jobs sonst
# denselben Draft gleichzeitig hochladen und zwei Publish-Jobs gegeneinander
# laufen können.
concurrency:
  group: echo-release-build
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  SOURCE_REPO: Subunit-UG/echo-app

jobs:
  # Ref (Quelle) + Tag (Release-Label) EINMAL bestimmen und streng validieren.
  # Beim Poller (schedule): neuesten Versions-Tag aus dem PRIVATEN echo-tauri holen
  # und nur bauen, wenn hier noch kein published Release dafür existiert. Sonst:
  # expliziter Ref aus dispatch/input. Stable akzeptiert ausschließlich vX.Y.Z;
  # manuelles draft_rc ausschließlich vX.Y.Z-rc.N. Keine Branches oder Shell-
  # Metazeichen. should_build=false
  # überspringt die Build-/Publish-Jobs (Poller ohne neue Version = No-op).
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      ref: ${{ steps.pick.outputs.ref }}
      source_commit: ${{ steps.source.outputs.commit }}
      tag: ${{ steps.pick.outputs.tag }}
      release_mode: ${{ steps.policy.outputs.release_mode }}
      prerelease: ${{ steps.policy.outputs.prerelease }}
      requires_platform_trust: ${{ steps.policy.outputs.requires_platform_trust }}
      should_build: ${{ steps.pick.outputs.should_build }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - id: pick
        env:
          EV: ${{ github.event_name }}
          DISPATCH_REF: ${{ github.event.client_payload.ref }}
          DISPATCH_TAG: ${{ github.event.client_payload.tag }}
          DISPATCH_MODE: ${{ github.event.client_payload.release_mode }}
          INPUT_REF: ${{ github.event.inputs.source_ref }}
          INPUT_TAG: ${{ github.event.inputs.release_tag }}
          INPUT_MODE: ${{ github.event.inputs.release_mode }}
          DEPLOY_KEY: ${{ secrets.ECHO_TAURI_DEPLOY_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          THIS_REPO: ${{ github.repository }}
        run: |
          set -eu
          if [ "$EV" = "schedule" ]; then
            # Neuesten Versions-Tag aus dem privaten echo-tauri holen — via git ls-remote
            # mit dem read-only Deploy-Key (kein PAT nötig; SSH-Git-Zugriff genügt).
            mkdir -p ~/.ssh && printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/echo_ci && chmod 600 ~/.ssh/echo_ci
            export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/echo_ci -o StrictHostKeyChecking=accept-new"
            ref=$(git ls-remote --tags --refs "git@github.com:$SOURCE_REPO.git" 'v*' 2>/dev/null \
                    | awk -F/ '{print $NF}' \
                    | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
                    | sort -V | tail -1 || true)
            rm -f ~/.ssh/echo_ci
            if [ -z "$ref" ]; then
              echo "keine Versions-Tags gefunden"; echo "should_build=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
            # Schon als NICHT-Draft-Release hier vorhanden? Dann nichts zu tun.
            if [ "$(gh release view "$ref" -R "$THIS_REPO" --json isDraft --jq '.isDraft' 2>/dev/null || echo missing)" = "false" ]; then
              echo "$ref ist bereits published — No-op"; echo "should_build=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
            if gh release view "$ref" -R "$THIS_REPO" --json body --jq '.body' 2>/dev/null | grep -Fq ECHO_HELD_STABLE_V1; then
              echo "$ref is a held Stable draft — poller No-op; manual promotion only"
              echo "should_build=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
            tag="$ref"; mode=stable; echo "neuer Stable-Tag $ref → wird gebaut"
          elif [ "$EV" = "repository_dispatch" ]; then
            ref="$DISPATCH_REF"; tag="${DISPATCH_TAG:-$DISPATCH_REF}"; mode="${DISPATCH_MODE:-stable}"
          else
            ref="$INPUT_REF"; tag="${INPUT_TAG:-$INPUT_REF}"; mode="${INPUT_MODE:-stable}"
          fi
          printf 'ref=%s\ntag=%s\nmode=%s\nshould_build=true\n' "$ref" "$tag" "$mode" >> "$GITHUB_OUTPUT"

      - id: policy
        if: steps.pick.outputs.should_build == 'true'
        env:
          EV: ${{ github.event_name }}
          REF: ${{ steps.pick.outputs.ref }}
          TAG: ${{ steps.pick.outputs.tag }}
          MODE: ${{ steps.pick.outputs.mode }}
        run: |
          set -euo pipefail
          bash scripts/release_policy.sh "$EV" "$REF" "$TAG" "$MODE" | tee -a "$GITHUB_OUTPUT"
          echo "Quelle $SOURCE_REPO@$REF → $MODE $TAG"

      - id: source
        name: Pin the exact private source commit
        if: steps.pick.outputs.should_build == 'true'
        env:
          DEPLOY_KEY: ${{ secrets.ECHO_TAURI_DEPLOY_KEY }}
          REF: ${{ steps.pick.outputs.ref }}
        run: |
          set -euo pipefail
          if [[ "$REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "commit=$REF" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/echo_ci
          chmod 600 ~/.ssh/echo_ci
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/echo_ci -o StrictHostKeyChecking=accept-new"
          refs=$(git ls-remote "git@github.com:$SOURCE_REPO.git" \
            "refs/tags/$REF" "refs/tags/$REF^{}" 2>/dev/null) \
            || { echo "::error::private source resolution failed"; exit 1; }
          rm -f ~/.ssh/echo_ci
          direct=$(printf '%s\n' "$refs" | awk -v ref="refs/tags/$REF" '$2 == ref { print $1 }')
          peeled=$(printf '%s\n' "$refs" | awk -v ref="refs/tags/$REF^{}" '$2 == ref { print $1 }')
          commit="${peeled:-$direct}"
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]] \
            || { echo "::error::source tag $REF did not resolve to one commit"; exit 1; }
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

  # Genau EINEN kanonischen Draft reservieren, BEVOR die Plattform-Matrix
  # startet. `releaseId` ist danach die einzige Upload-Adresse. Damit können
  # parallele tauri-action-Läufe nie wieder mehrere Drafts mit demselben Tag
  # erzeugen und die Assets aufteilen. Gleichzeitige Läufe desselben Tags werden
  # auf diese wenige Sekunden lange Reservierung serialisiert; andere Tags nicht.
  reserve:
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: echo-release-${{ needs.prepare.outputs.tag }}
      cancel-in-progress: false
    outputs:
      release_id: ${{ steps.reserve.outputs.release_id }}
    steps:
      - id: reserve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
          MODE: ${{ needs.prepare.outputs.release_mode }}
        run: |
          set -euo pipefail

          exact_releases() {
            gh api --paginate --slurp "repos/$REPO/releases?per_page=100" \
              | jq --arg tag "$TAG" '[.[][] | select(.tag_name == $tag)]'
          }

          matches=$(exact_releases)
          count=$(printf '%s' "$matches" | jq 'length')
          # GitHubs Release-Liste ist nach einem POST kurz eventual-consistent.
          # Ein direkt folgender Retry-Run darf einen gerade erzeugten Draft
          # deshalb nicht als "fehlt" missverstehen und einen zweiten anlegen.
          # Bei einem wirklich neuen Tag kosten die vier Settle-Reads nur 8 s.
          if [ "$count" -eq 0 ]; then
            for visibility_attempt in $(seq 1 4); do
              sleep 2
              matches=$(exact_releases)
              count=$(printf '%s' "$matches" | jq 'length')
              [ "$count" -eq 0 ] || break
              echo "release discovery settle $visibility_attempt/4: $TAG noch nicht sichtbar"
            done
          fi
          if [ "$count" -gt 1 ]; then
            printf '%s' "$matches" | jq -r '.[] | "::error::duplicate release id=\(.id) draft=\(.draft) url=\(.html_url)"'
            echo "::error::$TAG hat bereits $count Releases; keine Assets werden hochgeladen."
            exit 1
          fi

          if [ "$count" -eq 1 ]; then
            release=$(printf '%s' "$matches" | jq '.[0]')
            if [ "$(printf '%s' "$release" | jq -r '.draft')" != true ]; then
              echo "::error::$TAG ist bereits veröffentlicht; ein veröffentlichter Release wird nie überschrieben."
              exit 1
            fi
            if printf '%s' "$release" | jq -e '(.body // "") | contains("ECHO_HELD_STABLE_V1")' >/dev/null; then
              echo "::error::held stable draft cannot be rebuilt or published; use reviewed promotion"; exit 1
            fi
            [ "$MODE" != draft_stable ] || { echo "::error::draft_stable requires a fresh release label"; exit 1; }
            id=$(printf '%s' "$release" | jq -r '.id')
            # Ein alter Draft darf wiederaufgenommen werden, wird aber schon vor
            # dem Build auf den explizit gewählten Kanal normalisiert.
            # `tag_name` MUSS beim PATCH erneut mit: GitHub ersetzt den externen
            # Quelltag sonst bei Drafts still durch `untagged-<uuid>`.
            gh api -X PATCH "repos/$REPO/releases/$id" \
              -f tag_name="$TAG" -f name="Echo $TAG" \
              -F draft=true -F prerelease="$PRERELEASE" > /dev/null
            echo "reuse canonical draft $id for $TAG"
          else
            release=$(gh api -X POST "repos/$REPO/releases" \
              -f tag_name="$TAG" -f name="Echo $TAG" \
              -f body="$([ "$MODE" = draft_stable ] && echo ECHO_HELD_STABLE_V1 || true)" \
              -F draft=true -F prerelease="$PRERELEASE")
            id=$(printf '%s' "$release" | jq -r '.id // empty')
            if [ -z "$id" ]; then
              echo "::error::GitHub returned no release id for $TAG"
              exit 1
            fi
            echo "created canonical draft $id for $TAG"
          fi

          # Unter derselben Tag-Concurrency muss nach Create/Reuse exakt ein
          # Release existieren. Die ID ist sofort direkt lesbar, die Listenroute
          # brauchte im echten Alpha.6-Lauf dagegen >800 ms bis zur Sichtbarkeit.
          # Darum bounded retry statt falschem Rot; Duplikate stoppen sofort.
          direct=$(gh api "repos/$REPO/releases/$id")
          direct_canonical=$(printf '%s' "$direct" | jq -r --arg tag "$TAG" --argjson prerelease "$PRERELEASE" \
            'select(.tag_name == $tag and .draft == true and .prerelease == $prerelease) | .id')
          if [ "$direct_canonical" != "$id" ]; then
            echo "::error::reserved release id=$id is not the canonical draft for $TAG"
            exit 1
          fi
          reservation_ok=0
          for visibility_attempt in $(seq 1 10); do
            matches=$(exact_releases)
            count=$(printf '%s' "$matches" | jq 'length')
            canonical=$(printf '%s' "$matches" | jq -r --argjson id "$id" --argjson prerelease "$PRERELEASE" \
              '[.[] | select(.id == $id and .draft == true and .prerelease == $prerelease)] | length')
            if [ "$count" -gt 1 ]; then
              printf '%s' "$matches" | jq -r '.[] | "::error::duplicate release id=\(.id) draft=\(.draft) url=\(.html_url)"'
              echo "::error::release reservation lost its invariant (count=$count canonical=$canonical)"
              exit 1
            fi
            if [ "$count" -eq 1 ] && [ "$canonical" -eq 1 ]; then
              reservation_ok=1
              break
            fi
            echo "release visibility retry $visibility_attempt/10: count=$count canonical=$canonical"
            sleep 2
          done
          if [ "$reservation_ok" -ne 1 ]; then
            echo "::error::release reservation lost its invariant after bounded retry (count=$count canonical=$canonical)"
            exit 1
          fi
          echo "release_id=$id" >> "$GITHUB_OUTPUT"

  build_unsigned:
    needs: [prepare, reserve]
    if: needs.prepare.outputs.should_build == 'true'
    # Private source and npm lifecycle code run only in this unprivileged phase.
    # Signing, OIDC and release-write authority live on fresh runners below.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-24.04
            artifact: linux-x64
            target_dir: src-tauri/target/release
            args: "--features local-whisper-gpu"
          - platform: windows-latest
            artifact: windows-x64
            target_dir: src-tauri/target/release
            args: "--features local-whisper-gpu"
          - platform: windows-11-arm
            artifact: windows-arm64
            target_dir: src-tauri/target/release
            args: "--features local-whisper"
          - platform: macos-15
            artifact: macos-arm64
            target_dir: src-tauri/target/aarch64-apple-darwin/release
            args: "--target aarch64-apple-darwin --features local-whisper"

    runs-on: ${{ matrix.platform }}
    steps:
      # Privaten Quellcode (echo-tauri@ref) auschecken — MANUELLER git clone per
      # read-only Deploy-Key, NICHT actions/checkout mit ssh-key: dessen SSH-Handling
      # bricht auf windows-11-arm (Permission denied publickey). Der manuelle Weg
      # nutzt auf allen Plattformen git-bashs OpenSSH einheitlich. Kein PAT nötig →
      # der Nutzer muss nichts anlegen. Schlüssel wird nach dem Clone sofort gelöscht
      # und liegt nicht in der git-config (kein Zugriff für npm/cargo).
      - name: Checkout private source (deploy key)
        shell: bash
        env:
          DEPLOY_KEY: ${{ secrets.ECHO_TAURI_DEPLOY_KEY }}
          REF: ${{ needs.prepare.outputs.ref }}
          SOURCE_COMMIT: ${{ needs.prepare.outputs.source_commit }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -eu
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/echo_ci
          chmod 600 ~/.ssh/echo_ci
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/echo_ci -o StrictHostKeyChecking=accept-new"
          if [[ "$REF" =~ ^[0-9a-f]{40}$ ]]; then
            git init . >/dev/null 2>&1 || { echo "::error::private source checkout failed"; exit 1; }
            git remote add origin "git@github.com:$SOURCE_REPO.git" >/dev/null 2>&1 || { echo "::error::private source checkout failed"; exit 1; }
            git fetch --depth 1 origin "$SOURCE_COMMIT" >/dev/null 2>&1 || { echo "::error::private source checkout failed"; exit 1; }
            git checkout --detach FETCH_HEAD >/dev/null 2>&1 || { echo "::error::private source checkout failed"; exit 1; }
          else
            git clone --depth 1 --branch "$REF" "git@github.com:$SOURCE_REPO.git" . >/dev/null 2>&1 || { echo "::error::private source checkout failed"; exit 1; }
          fi
          git config --unset-all core.sshCommand 2>/dev/null || true
          rm -f ~/.ssh/echo_ci
          [ "$(git rev-parse HEAD)" = "$SOURCE_COMMIT" ] \
            || { echo "::error::source tag moved after prepare"; exit 1; }

      - name: Reserve trusted CI paths
        shell: bash
        run: |
          set -euo pipefail
          for path in _release-ci; do
            if [ -e "$path" ] || [ -L "$path" ]; then
              echo "::error::reserved CI path already exists"; exit 1
            fi
          done

      - name: Checkout trusted public CI controls
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: _release-ci
          persist-credentials: false

      - name: Install Linux deps
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libsoup-3.0-dev librsvg2-dev libayatana-appindicator3-dev \
            libasound2-dev libxdo-dev libssl-dev patchelf \
            build-essential clang libclang-dev cmake \
            libvulkan-dev glslc
          echo "VULKAN_SDK=/usr" >> "$GITHUB_ENV"

      - name: LLVM x64 + CMake + Ninja (Windows x64)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          choco install llvm cmake ninja --no-progress -y --installargs 'ADD_CMAKE_TO_PATH=System'
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Append
          "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          "C:\Program Files\CMake\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          "CMAKE_GENERATOR=Ninja" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Vulkan SDK (Windows x64, GPU whisper — keep glslc for shader gen)
        if: matrix.platform == 'windows-latest'
        uses: jakoch/install-vulkan-sdk-action@37effcfa045411f8bfbbda26df2fd1b3bf3436fa # v1
        with:
          # 1.3.290.0 is no longer offered by LunarG (download 404 since 2026-11). 1.3.296.0 is the
          # oldest SDK still published and stays in the 1.3 line the GPU whisper build was proven on.
          vulkan_version: 1.3.296.0
          install_runtime: true
          cache: true
          stripdown: false

      - name: glslc on PATH (Windows x64)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: '"$env:VULKAN_SDK\Bin" | Out-File -FilePath $env:GITHUB_PATH -Append'

      - name: MSVC env (Windows x64 — Ninja needs cl + INCLUDE/LIB in the job env)
        if: matrix.platform == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      - name: ARM64 LLVM + CMake + Ninja (Windows ARM — choco LLVM is x64)
        if: matrix.platform == 'windows-11-arm'
        shell: pwsh
        run: |
          # MSVC 14.51 (VS 18 im Runner-Image) lehnt Clang < 20 per STL1000 ab.
          # 20.1.8 = dieselbe Version, mit der der x64-Job baut.
          $url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-20.1.8/LLVM-20.1.8-woa64.exe"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\llvm-arm64.exe"
          Start-Process -FilePath "$env:RUNNER_TEMP\llvm-arm64.exe" -ArgumentList '/S' -Wait
          & "C:\Program Files\LLVM\bin\clang-cl.exe" --version
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Append
          "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          # CMake 4.4.4 from Kitware, pinned by hash — the x86_64 build, on
          # purpose: it runs emulated on ARM64, reports the host as AMD64, and
          # libopus (opusic-sys) then builds as plain C. That is what every
          # green Windows-ARM build had (choco's cmake.install = the x86_64
          # MSI). A native ARM64 CMake (the image's, or the arm64 zip of #14)
          # makes opus take its 32-bit-ARM MSVC detection path, which clang-cl
          # rejects (armcpu.c: undeclared '__emit'). Chocolatey itself is not
          # used: its feed refuses runner IPs at times.
          $cmakeZip = "$env:RUNNER_TEMP\cmake-x64.zip"
          Invoke-WebRequest -Uri "https://github.com/Kitware/CMake/releases/download/v4.4.4/cmake-4.4.4-windows-x86_64.zip" -OutFile $cmakeZip
          $sha = (Get-FileHash -Algorithm SHA256 $cmakeZip).Hash.ToLower()
          if ($sha -ne "bace36e94b31c68ab6fa295f26dfa11219e0701cf7c94b0284a7d1cb13dac536") { throw "CMake download hash mismatch: $sha" }
          Expand-Archive -Path $cmakeZip -DestinationPath "$env:RUNNER_TEMP\cmake" -Force
          $cmakeBin = "$env:RUNNER_TEMP\cmake\cmake-4.4.4-windows-x86_64\bin"
          & "$cmakeBin\cmake.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "CMake 4.4.4 not runnable" }
          "$cmakeBin" | Out-File -FilePath $env:GITHUB_PATH -Append
          choco install ninja --no-progress -y
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) { throw "ninja missing" }
          "CMAKE_GENERATOR=Ninja" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CC=clang-cl" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CXX=clang-cl" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CXXFLAGS=/EHsc" | Out-File -FilePath $env:GITHUB_ENV -Append
          "GGML_CPU_AARCH64=OFF" | Out-File -FilePath $env:GITHUB_ENV -Append
          "GGML_CPU_REPACK=OFF" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: MSVC env for clang-cl (Windows ARM — INCLUDE/LIB for the ARM64 MSVC CRT)
        if: matrix.platform == 'windows-11-arm'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: arm64

      # macos-14 wurde am 02.11.2026 außer Betrieb genommen (Standard dort Xcode 15.4).
      # Xcode ist fest gepinnt statt Image-Standard: ein späterer Standardwechsel des
      # Images (z. B. auf Xcode 26) darf Toolchain und Notarisierung nicht still ändern.
      # Fehlt die Version im Image, bricht der Build hier sichtbar ab (bewusst anheben).
      # Mindest-macOS bleibt unabhängig vom Runner: 11.0 hier und minimumSystemVersion
      # in der tauri.conf.json des Quell-Repos.
      - name: macOS build env (Xcode pin, cmake, deployment target for whisper.cpp std::filesystem)
        if: matrix.platform == 'macos-15'
        run: |
          set -euo pipefail
          xcode_app=/Applications/Xcode_16.4.app
          [ -d "$xcode_app" ] || { echo "::error::$xcode_app fehlt im Runner-Image; Xcode-Pin bewusst anheben"; exit 1; }
          sudo xcode-select -s "$xcode_app/Contents/Developer"
          xcodebuild -version
          echo "macOS SDK $(xcrun --sdk macosx --show-sdk-version)"
          brew list cmake >/dev/null 2>&1 || brew install cmake
          echo "MACOSX_DEPLOYMENT_TARGET=11.0" >> "$GITHUB_ENV"
          echo "CMAKE_OSX_DEPLOYMENT_TARGET=11.0" >> "$GITHUB_ENV"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: ${{ matrix.platform == 'macos-15' && 'aarch64-apple-darwin' || '' }}

      - name: Verify release label matches every app version
        shell: bash
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          bash _release-ci/scripts/run-confidential.sh node <<'NODE'
          const fs = require("fs");
          const { execFileSync } = require("child_process");
          const expected = process.env.TAG.slice(1);
          const packageVersion = JSON.parse(
            fs.readFileSync("package.json", "utf8")
          ).version;
          const packageLock = JSON.parse(
            fs.readFileSync("package-lock.json", "utf8")
          );
          const tauriVersion = JSON.parse(
            fs.readFileSync("src-tauri/tauri.conf.json", "utf8")
          ).version;
          const metadata = JSON.parse(
            execFileSync(
              "cargo",
              [
                "metadata",
                "--no-deps",
                "--locked",
                "--format-version",
                "1",
                "--manifest-path",
                "src-tauri/Cargo.toml",
              ],
              { encoding: "utf8" }
            )
          );
          const cargoVersion = metadata.packages.find(
            (entry) => entry.name === "echo"
          )?.version;
          const versions = {
            "package.json": packageVersion,
            "package-lock.json": packageLock.version,
            "package-lock.json root": packageLock.packages?.[""]?.version,
            "tauri.conf.json": tauriVersion,
            "Cargo.toml": cargoVersion,
          };
          const mismatches = Object.entries(versions).filter(
            ([, version]) => version !== expected
          );
          if (mismatches.length) {
            console.error(
              `::error::source tag ${process.env.REF} expects ${expected}; ` +
                mismatches
                  .map(([file, version]) => `${file}=${version || "<missing>"}`)
                  .join(", ")
            );
            process.exit(1);
          }
          console.log(`version contract verified: ${expected}`);
          NODE

      - shell: bash
        run: bash _release-ci/scripts/run-confidential.sh npm ci

      - name: Compile private source without bundling or signing
        shell: bash
        run: bash _release-ci/scripts/run-confidential.sh npm run tauri build -- --no-bundle ${{ matrix.args }}

      - name: Stage bundle-only input without private source
        shell: bash
        env:
          ARTIFACT: ${{ matrix.artifact }}
          SOURCE_COMMIT: ${{ needs.prepare.outputs.source_commit }}
          TAG: ${{ needs.prepare.outputs.tag }}
          TARGET_DIR: ${{ matrix.target_dir }}
          HANDOFF_ROOT: ${{ runner.temp }}/echo-handoff-${{ matrix.artifact }}
        run: |
          set -euo pipefail
          bash _release-ci/scripts/run-confidential.sh node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const workspace = fs.realpathSync(process.cwd());
          const handoff = path.resolve(process.env.HANDOFF_ROOT);
          const root = path.join(handoff, 'bundle-input');
          const tauriSource = path.join(workspace, 'src-tauri');
          const tauriTarget = path.join(root, 'src-tauri');
          fs.mkdirSync(tauriTarget, { recursive: true, mode: 0o700 });

          const within = (base, candidate) => candidate === base || candidate.startsWith(base + path.sep);
          const safePath = (raw, expectedRoot, allowGlob = true) => {
            if (typeof raw !== 'string' || !raw || raw.includes('\0') || /^[a-z]+:\/\//i.test(raw)) {
              throw new Error('invalid bundle path');
            }
            if (path.isAbsolute(raw) || /^[A-Za-z]:[\\/]/.test(raw) || /^[/\\]{2}/.test(raw)) {
              throw new Error('absolute bundle path rejected');
            }
            const normalized = raw.replace(/\\/g, '/');
            const segments = normalized.split('/');
            if (segments.some((segment) => !segment || segment === '..' || segment.startsWith('.')) || normalized.includes(':')) {
              throw new Error('dot or empty bundle path segment rejected');
            }
            if (expectedRoot && segments[0] !== expectedRoot) throw new Error('bundle path outside allowlist');
            if (!allowGlob && /[?*\[\]{}]/.test(normalized)) throw new Error('glob destination rejected');
            return segments.join('/');
          };
          const copyBundleEntry = (source, expectedRoot) => {
            const resolved = path.resolve(source);
            if (!within(tauriSource, resolved) || !fs.existsSync(resolved)) return false;
            const relative = safePath(path.relative(tauriSource, resolved), expectedRoot);
            const stat = fs.lstatSync(resolved);
            if (stat.isSymbolicLink()) throw new Error('bundle symlink rejected');
            const destination = path.join(tauriTarget, ...relative.split('/'));
            fs.mkdirSync(path.dirname(destination), { recursive: true });
            if (stat.isDirectory()) {
              fs.mkdirSync(destination, { recursive: true });
              for (const name of fs.readdirSync(resolved)) copyBundleEntry(path.join(resolved, name), expectedRoot);
            } else if (stat.isFile()) {
              fs.copyFileSync(resolved, destination);
              fs.chmodSync(destination, stat.mode & 0o777);
            } else {
              throw new Error('unsupported bundle input type');
            }
            return true;
          };
          const copyBundleSpec = (raw, expectedRoot) => {
            const spec = safePath(raw, expectedRoot);
            const wildcard = spec.search(/[?*[{]/);
            const staticPrefix = (wildcard === -1 ? spec : spec.slice(0, wildcard)).replace(/\/+$/, '');
            let source = path.resolve(tauriSource, staticPrefix || expectedRoot);
            if (wildcard !== -1 && fs.existsSync(source) && !fs.lstatSync(source).isDirectory()) source = path.dirname(source);
            if (copyBundleEntry(source, expectedRoot)) return spec;
            const directory = path.dirname(source);
            const prefix = path.basename(source);
            let copied = false;
            if (fs.existsSync(directory)) {
              for (const name of fs.readdirSync(directory)) {
                if (name.startsWith(prefix)) copied = copyBundleEntry(path.join(directory, name), expectedRoot) || copied;
              }
            }
            if (!copied) throw new Error('bundle path has no staged input');
            return spec;
          };
          const sourceList = (value, expectedRoot) => {
            if (value === undefined) return [];
            const entries = Array.isArray(value) ? value : [value];
            return entries.map((entry) => copyBundleSpec(entry, expectedRoot));
          };
          const resourcePaths = (value) => {
            if (value === undefined) return [];
            if (Array.isArray(value) || typeof value === 'string') return sourceList(value, 'resources');
            if (!value || typeof value !== 'object') throw new Error('invalid resources allowlist');
            return Object.fromEntries(Object.entries(value).map(([source, destination]) => [
              copyBundleSpec(source, 'resources'), safePath(destination, null, false)
            ]));
          };

          const primaryPath = path.join(tauriSource, 'tauri.conf.json');
          if (!fs.existsSync(primaryPath)) throw new Error('tauri.conf.json missing');
          const primary = JSON.parse(fs.readFileSync(primaryPath, 'utf8'));
          const productName = primary.productName;
          const version = process.env.TAG.slice(1);
          const identifier = primary.identifier;
          if (typeof productName !== 'string' || !/^[A-Za-z0-9][A-Za-z0-9 _.-]{0,79}$/.test(productName)) {
            throw new Error('invalid product name');
          }
          if (primary.version !== version || !/^[0-9]+\.[0-9]+\.[0-9]+(?:-rc\.[0-9]+)?$/.test(version)) {
            throw new Error('invalid bundle version');
          }
          if (typeof identifier !== 'string' || !/^[A-Za-z0-9]+(?:[.-][A-Za-z0-9]+)+$/.test(identifier)) {
            throw new Error('invalid bundle identifier');
          }
          const bundle = primary.bundle && typeof primary.bundle === 'object' ? primary.bundle : {};
          const icon = sourceList(bundle.icon, 'icons');
          const resources = resourcePaths(bundle.resources);
          const binary = 'echo';

          const targetSource = path.resolve(workspace, process.env.TARGET_DIR);
          const targetDestination = path.resolve(root, process.env.TARGET_DIR);
          if (!within(workspace, targetSource) || !fs.existsSync(targetSource)) throw new Error('compiled target directory missing');
          fs.mkdirSync(targetDestination, { recursive: true });
          const executable = process.platform === 'win32' ? `${binary}.exe` : binary;
          const copyCompiledFile = (source) => {
            const resolved = path.resolve(source);
            if (!within(targetSource, resolved) || !fs.existsSync(resolved)) return false;
            const stat = fs.lstatSync(resolved);
            if (stat.isSymbolicLink() || !stat.isFile()) throw new Error('compiled input must be a regular file');
            const destination = path.join(targetDestination, path.basename(resolved));
            fs.copyFileSync(resolved, destination);
            fs.chmodSync(destination, stat.mode & 0o777);
            return true;
          };
          if (!copyCompiledFile(path.join(targetSource, executable))) throw new Error('compiled application binary missing');
          for (const name of fs.readdirSync(targetSource)) {
            if (name === executable || /\.(?:d|pdb|rlib|rmeta)$/i.test(name)) continue;
            const candidate = path.join(targetSource, name);
            const stat = fs.lstatSync(candidate);
            if (stat.isSymbolicLink()) throw new Error('compiled symlink rejected');
            if (stat.isFile() && (/\.(?:exe|dll|dylib|so)$/i.test(name) || (stat.mode & 0o111))) copyCompiledFile(candidate);
          }
          fs.writeFileSync(path.join(root, 'handoff-metadata.json'), JSON.stringify({
            schema: 2, artifact: process.env.ARTIFACT, source_commit: process.env.SOURCE_COMMIT,
            tag: process.env.TAG, binary, target_dir: process.env.TARGET_DIR
          }) + '\n', { mode: 0o600 });
          fs.writeFileSync(path.join(root, 'handoff-bundle-config.json'), JSON.stringify({
            productName, version, identifier, icon, resources
          }) + '\n', { mode: 0o600 });
          NODE
          archive="$RUNNER_TEMP/unsigned-${{ matrix.artifact }}.tar.gz"
          tar -czf "$archive" -C "$HANDOFF_ROOT" bundle-input
          test -s "$archive"

      - name: Upload immutable unsigned platform input
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unsigned-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.artifact }}
          path: ${{ runner.temp }}/unsigned-${{ matrix.artifact }}.tar.gz
          if-no-files-found: error
          retention-days: 1

  bind_unsigned_artifacts:
    needs: [prepare, build_unsigned]
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      artifact_id: ${{ steps.bind.outputs.artifact-id }}
      artifact_digest: ${{ steps.bind.outputs.artifact-digest }}
    steps:
      - name: Download the four immutable build artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          pattern: unsigned-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: ${{ runner.temp }}/unsigned
          merge-multiple: true
      - name: Bind exact platform bytes into one manifest
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/unsigned"
          expected=(linux-x64 windows-x64 windows-arm64 macos-arm64)
          [ "$(find . -maxdepth 1 -type f -name 'unsigned-*.tar.gz' | wc -l | tr -d ' ')" -eq 4 ] \
            || { echo "::error::expected four unsigned platform archives"; exit 1; }
          : > MANIFEST.sha256
          for platform in "${expected[@]}"; do
            file="unsigned-$platform.tar.gz"
            [ -s "$file" ] || { echo "::error::missing $file"; exit 1; }
            sha256sum "$file" >> MANIFEST.sha256
          done
          sha256sum -c MANIFEST.sha256
      - id: bind
        name: Upload digest-bound release handoff
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bound-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/unsigned/MANIFEST.sha256
            ${{ runner.temp }}/unsigned/unsigned-linux-x64.tar.gz
            ${{ runner.temp }}/unsigned/unsigned-windows-x64.tar.gz
            ${{ runner.temp }}/unsigned/unsigned-windows-arm64.tar.gz
            ${{ runner.temp }}/unsigned/unsigned-macos-arm64.tar.gz
          if-no-files-found: error
          retention-days: 1

  build:
    needs: [prepare, reserve, bind_unsigned_artifacts]
    if: needs.prepare.outputs.should_build == 'true'
    environment: release-signing
    permissions:
      actions: read
      contents: write
      id-token: write
    env:
      WINDOWS_SIGNING_BACKEND: ${{ vars.WINDOWS_SIGNING_BACKEND || 'none' }}
      WINDOWS_PUBLISHER: ${{ vars.WINDOWS_PUBLISHER }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            artifact: linux-x64
            target_dir: src-tauri/target/release
            bundles: appimage
            args: "--features local-whisper-gpu"
          - runner: windows-latest
            artifact: windows-x64
            target_dir: src-tauri/target/release
            bundles: nsis
            args: "--features local-whisper-gpu"
          - runner: windows-11-arm
            artifact: windows-arm64
            target_dir: src-tauri/target/release
            bundles: nsis
            args: "--features local-whisper"
          - runner: macos-15
            artifact: macos-arm64
            target_dir: src-tauri/target/aarch64-apple-darwin/release
            bundles: app,dmg
            args: "--target aarch64-apple-darwin --features local-whisper"
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout trusted public CI controls on the fresh runner
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: _release-ci
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: ${{ matrix.runner == 'macos-15' && 'aarch64-apple-darwin' || '' }}

      - name: Install trusted bundling prerequisites
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.runner }}" = ubuntu-24.04 ]; then
            sudo apt-get update
            sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
              librsvg2-dev libayatana-appindicator3-dev patchelf
          elif [ "${{ matrix.runner }}" = macos-15 ]; then
            xcode_app=/Applications/Xcode_16.4.app
            [ -d "$xcode_app" ] || { echo "::error::$xcode_app missing"; exit 1; }
            sudo xcode-select -s "$xcode_app/Contents/Developer"
          fi
          tools="$RUNNER_TEMP/trusted-tauri-cli"
          mkdir -p "$tools"
          cd "$tools"
          bash "$GITHUB_WORKSPACE/_release-ci/scripts/run-confidential.sh" npm init -y
          bash "$GITHUB_WORKSPACE/_release-ci/scripts/run-confidential.sh" npm install \
            --ignore-scripts --no-audit --no-fund --save-exact @tauri-apps/cli@2.10.1
          echo "TAURI_CLI=$tools/node_modules/.bin/tauri" >> "$GITHUB_ENV"

      - name: Download exact handoff ID and verify GitHub artifact digest
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACT_ID: ${{ needs.bind_unsigned_artifacts.outputs.artifact_id }}
          EXPECTED_DIGEST: ${{ needs.bind_unsigned_artifacts.outputs.artifact_digest }}
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]] || { echo "::error::invalid handoff artifact id"; exit 1; }
          [[ "$EXPECTED_DIGEST" =~ ^(sha256:)?[0-9a-f]{64}$ ]] || { echo "::error::invalid handoff digest"; exit 1; }
          archive="$RUNNER_TEMP/bound-handoff.zip"
          gh api "repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID/zip" > "$archive"
          actual="$(sha256sum "$archive" | awk '{print $1}')"
          [ "$actual" = "${EXPECTED_DIGEST#sha256:}" ] || { echo "::error::handoff digest mismatch"; exit 1; }
          mkdir "$RUNNER_TEMP/bound-handoff"
          python - "$archive" "$RUNNER_TEMP/bound-handoff" <<'PY'
          import pathlib, stat, sys, zipfile
          archive, destination = pathlib.Path(sys.argv[1]), pathlib.Path(sys.argv[2]).resolve()
          with zipfile.ZipFile(archive) as source:
              members = source.infolist()
              if not members:
                  raise SystemExit('empty handoff')
              for member in members:
                  path = pathlib.PurePosixPath(member.filename)
                  mode = member.external_attr >> 16
                  if path.is_absolute() or '..' in path.parts or stat.S_ISLNK(mode):
                      raise SystemExit('unsafe handoff member')
              source.extractall(destination)
          PY
          cd "$RUNNER_TEMP/bound-handoff"
          sha256sum -c MANIFEST.sha256
          platform_archive="unsigned-${{ matrix.artifact }}.tar.gz"
          python "$GITHUB_WORKSPACE/_release-ci/scripts/validate-macos-app-archive.py" \
            "$platform_archive" "$RUNNER_TEMP/platform-handoff"

      - name: Rebuild trusted bundle root from the allowlisted handoff
        shell: bash
        env:
          ARTIFACT: ${{ matrix.artifact }}
          SOURCE_COMMIT: ${{ needs.prepare.outputs.source_commit }}
          TAG: ${{ needs.prepare.outputs.tag }}
          TARGET_DIR: ${{ matrix.target_dir }}
          TRUSTED_SIGN_SCRIPT: ${{ github.workspace }}/_release-ci/scripts/sign-windows.ps1
        run: |
          set -euo pipefail
          untrusted_root="$RUNNER_TEMP/platform-handoff/bundle-input"
          trusted_parent="$(mktemp -d "${TMPDIR:-/tmp}/echo-trusted-bundle.XXXXXX")"
          trusted_root="$trusted_parent/bundle"
          cargo_home="$trusted_parent/cargo-home"
          python3 - "$untrusted_root" "$trusted_root" "$cargo_home" <<'PY'
          import glob
          import json
          import os
          import pathlib
          import re
          import shutil
          import stat
          import sys

          untrusted_root = pathlib.Path(sys.argv[1]).resolve(strict=True)
          trusted_root = pathlib.Path(sys.argv[2])
          cargo_home = pathlib.Path(sys.argv[3])
          if not untrusted_root.is_dir() or trusted_root.exists() or cargo_home.exists():
              raise SystemExit('bundle roots violate the fresh-directory contract')

          def read_object(path):
              value = json.loads(path.read_text(encoding='utf-8'))
              if not isinstance(value, dict):
                  raise SystemExit('handoff object required')
              return value

          def exact_keys(value, expected, label):
              if set(value) != set(expected):
                  raise SystemExit(f'{label} contains non-allowlisted keys')

          def safe_path(raw, expected_root=None, allow_glob=True):
              if not isinstance(raw, str) or not raw or '\0' in raw or re.match(r'^[a-z]+://', raw, re.I):
                  raise SystemExit('invalid bundle path')
              normalized = raw.replace('\\', '/')
              if normalized.startswith('/') or normalized.startswith('//') or re.match(r'^[A-Za-z]:/', normalized):
                  raise SystemExit('absolute bundle path rejected')
              parts = normalized.split('/')
              if any(not part or part == '..' or part.startswith('.') for part in parts) or ':' in normalized:
                  raise SystemExit('dot or empty bundle path segment rejected')
              if expected_root and parts[0] != expected_root:
                  raise SystemExit('bundle path outside allowlist')
              if not allow_glob and re.search(r'[?*\[\]{}]', normalized):
                  raise SystemExit('glob destination rejected')
              return '/'.join(parts)

          for entry in untrusted_root.rglob('*'):
              relative = entry.relative_to(untrusted_root)
              if any(part.startswith('.') or part in ('.', '..') for part in relative.parts):
                  raise SystemExit('dot-segment entry rejected')
              if entry.is_symlink():
                  raise SystemExit('symlinked handoff entry rejected')
              if not (entry.is_dir() or entry.is_file()):
                  raise SystemExit('unsupported handoff entry rejected')
              if re.fullmatch(r'tauri(?:\.[A-Za-z0-9_-]+)?\.conf\.json', entry.name):
                  raise SystemExit('untrusted Tauri configuration rejected')

          metadata = read_object(untrusted_root / 'handoff-metadata.json')
          expected_metadata = {
              'schema': 2,
              'artifact': os.environ['ARTIFACT'],
              'source_commit': os.environ['SOURCE_COMMIT'],
              'tag': os.environ['TAG'],
              'binary': 'echo',
              'target_dir': os.environ['TARGET_DIR'],
          }
          if metadata != expected_metadata:
              raise SystemExit('handoff identity mismatch')

          config = read_object(untrusted_root / 'handoff-bundle-config.json')
          exact_keys(config, ('productName', 'version', 'identifier', 'icon', 'resources'), 'bundle config')
          product_name = config['productName']
          version = config['version']
          identifier = config['identifier']
          expected_version = os.environ['TAG'][1:]
          if not isinstance(product_name, str) or not re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9 _.-]{0,79}', product_name):
              raise SystemExit('invalid product name')
          if version != expected_version or not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+(?:-rc\.[0-9]+)?', version):
              raise SystemExit('invalid bundle version')
          if not isinstance(identifier, str) or not re.fullmatch(r'[A-Za-z0-9]+(?:[.-][A-Za-z0-9]+)+', identifier):
              raise SystemExit('invalid bundle identifier')

          icons_value = config['icon']
          if not isinstance(icons_value, list):
              raise SystemExit('icon allowlist must be a list')
          icons = [safe_path(value, 'icons') for value in icons_value]
          resources_value = config['resources']
          if isinstance(resources_value, list):
              resources = [safe_path(value, 'resources') for value in resources_value]
              resource_sources = resources
          elif isinstance(resources_value, dict):
              resources = {}
              resource_sources = []
              for source, destination in resources_value.items():
                  normalized_source = safe_path(source, 'resources')
                  resources[normalized_source] = safe_path(destination, allow_glob=False)
                  resource_sources.append(normalized_source)
          else:
              raise SystemExit('resources allowlist must be a list or object')

          untrusted_tauri = untrusted_root / 'src-tauri'
          trusted_tauri = trusted_root / 'src-tauri'
          trusted_tauri.mkdir(parents=True, mode=0o700)

          def copy_entry(source, expected_root):
              relative = source.relative_to(untrusted_tauri)
              normalized = safe_path(relative.as_posix(), expected_root)
              destination = trusted_tauri.joinpath(*normalized.split('/'))
              if source.is_dir():
                  destination.mkdir(parents=True, exist_ok=True)
                  for child in source.iterdir():
                      copy_entry(child, expected_root)
              elif source.is_file():
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(source, destination)
              else:
                  raise SystemExit('unsupported allowlisted bundle entry')

          def copy_spec(spec, expected_root):
              pattern = str(untrusted_tauri.joinpath(*spec.split('/')))
              matches = [pathlib.Path(value) for value in glob.glob(pattern, recursive=True)]
              if not matches:
                  raise SystemExit('allowlisted bundle path is missing')
              for source in sorted(matches, key=lambda value: (len(value.parts), str(value))):
                  resolved = source.resolve(strict=True)
                  if not resolved.is_relative_to(untrusted_tauri):
                      raise SystemExit('allowlisted bundle path escapes src-tauri')
                  copy_entry(source, expected_root)

          for spec in icons:
              copy_spec(spec, 'icons')
          for spec in resource_sources:
              copy_spec(spec, 'resources')

          target_relative = safe_path(os.environ['TARGET_DIR'])
          target_source = untrusted_root.joinpath(*target_relative.split('/'))
          target_destination = trusted_root.joinpath(*target_relative.split('/'))
          if not target_source.is_dir():
              raise SystemExit('compiled target directory missing')
          target_destination.mkdir(parents=True)
          executable = 'echo.exe' if os.name == 'nt' else 'echo'
          copied_executable = False
          for source in target_source.iterdir():
              if source.is_symlink() or not source.is_file():
                  raise SystemExit('compiled target contains a non-file entry')
              mode = stat.S_IMODE(source.stat().st_mode)
              allowed = source.name == executable or re.search(r'\.(?:exe|dll|dylib|so)$', source.name, re.I) or mode & 0o111
              if not allowed:
                  raise SystemExit('compiled target contains a non-allowlisted file')
              shutil.copy2(source, target_destination / source.name)
              copied_executable = copied_executable or source.name == executable
          if not copied_executable:
              raise SystemExit('compiled application binary missing')

          binary = 'echo'
          manifest = (
              f'[package]\nname = {json.dumps(binary)}\nversion = {json.dumps(version)}\n'
              f'edition = "2021"\ndefault-run = {json.dumps(binary)}\n\n[[bin]]\n'
              f'name = {json.dumps(binary)}\npath = "src/main.rs"\n\n[dependencies]\ntauri = "2"\n'
          )
          (trusted_tauri / 'Cargo.toml').write_text(manifest, encoding='utf-8')
          (trusted_tauri / 'src').mkdir()
          (trusted_tauri / 'src/main.rs').write_text('fn main() {}\n', encoding='utf-8')

          windows = {
              'certificateThumbprint': None,
              'signCommand': None,
              'nsis': {'template': None, 'installerHooks': None, 'customLanguageFiles': {}},
              'wix': {'template': None, 'fragmentPaths': []},
          }
          if os.environ.get('WINDOWS_SIGNING_BACKEND') != 'none':
              windows['signCommand'] = {
                  'cmd': 'pwsh',
                  'args': ['-NoProfile', '-NonInteractive', '-File', os.environ['TRUSTED_SIGN_SCRIPT'], '%1']
              }
          trusted_config = {
              'productName': product_name,
              'version': version,
              'identifier': identifier,
              'build': {'beforeBuildCommand': None, 'beforeDevCommand': None, 'beforeBundleCommand': None},
              'bundle': {
                  'active': True,
                  'createUpdaterArtifacts': True,
                  'icon': icons,
                  'resources': resources,
                  'windows': windows,
              }
          }
          trusted_config_path = trusted_tauri / 'tauri.conf.json'
          trusted_config_path.write_text(json.dumps(trusted_config), encoding='utf-8')

          for directory in (trusted_root, *trusted_root.parents):
              if (directory / '.cargo').exists():
                  raise SystemExit('ambient Cargo project configuration rejected')
          cargo_home.mkdir(mode=0o700)
          (cargo_home / 'config.toml').write_text('[net]\ngit-fetch-with-cli = false\n', encoding='utf-8')

          github_env = pathlib.Path(os.environ['GITHUB_ENV'])
          with github_env.open('a', encoding='utf-8') as output:
              output.write(f'BUNDLE_ROOT={trusted_root}\n')
              output.write(f'TRUSTED_BUNDLE_CONFIG={trusted_config_path}\n')
              output.write(f'CARGO_HOME={cargo_home}\n')
              output.write(f'CARGO_TARGET_DIR={target_destination}\n')
          PY

      - name: Validate Windows signing backend and settings
        if: runner.os == 'Windows' && (vars.WINDOWS_SIGNING_BACKEND == 'artifact-signing' || vars.WINDOWS_SIGNING_BACKEND == 'azure-key-vault')
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARTIFACT_SIGNING_ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          ARTIFACT_SIGNING_ACCOUNT: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          ARTIFACT_SIGNING_CERTIFICATE_PROFILE: ${{ vars.ARTIFACT_SIGNING_CERTIFICATE_PROFILE }}
          AZURE_KEY_VAULT_CERTIFICATE_URL: ${{ vars.AZURE_KEY_VAULT_CERTIFICATE_URL }}
        run: |
          $ErrorActionPreference = 'Stop'
          switch -CaseSensitive ($env:WINDOWS_SIGNING_BACKEND) {
            'artifact-signing' { $settings = @('ARTIFACT_SIGNING_ENDPOINT', 'ARTIFACT_SIGNING_ACCOUNT', 'ARTIFACT_SIGNING_CERTIFICATE_PROFILE') }
            'azure-key-vault' { $settings = @('AZURE_KEY_VAULT_CERTIFICATE_URL') }
            default { throw 'Cloud signing is required in the privileged phase' }
          }
          $settings += @('AZURE_CLIENT_ID', 'AZURE_TENANT_ID', 'AZURE_SUBSCRIPTION_ID', 'WINDOWS_PUBLISHER')
          foreach ($name in $settings) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) { throw "Missing signing setting: $name" }
          }

      - name: Azure OIDC login for Windows signing
        if: runner.os == 'Windows' && (vars.WINDOWS_SIGNING_BACKEND == 'artifact-signing' || vars.WINDOWS_SIGNING_BACKEND == 'azure-key-vault')
        uses: azure/login@8216e11d8cd9b42fe925c852af8e76311ff067ac # v2, immutable
        env:
          AZURE_CORE_OUTPUT: none
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Prepare Windows cloud signing
        if: runner.os == 'Windows' && (vars.WINDOWS_SIGNING_BACKEND == 'artifact-signing' || vars.WINDOWS_SIGNING_BACKEND == 'azure-key-vault')
        shell: pwsh
        env:
          AZURE_KEY_VAULT_CERTIFICATE_URL: ${{ vars.AZURE_KEY_VAULT_CERTIFICATE_URL }}
          ARTIFACT_SIGNING_ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          ARTIFACT_SIGNING_ACCOUNT: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          ARTIFACT_SIGNING_CERTIFICATE_PROFILE: ${{ vars.ARTIFACT_SIGNING_CERTIFICATE_PROFILE }}
        run: |
          $ErrorActionPreference = 'Stop'
          $signing = Join-Path $env:RUNNER_TEMP 'windows-signing'
          New-Item -ItemType Directory -Path $signing | Out-Null
          $configPath = Join-Path $signing 'provider.json'
          switch -CaseSensitive ($env:WINDOWS_SIGNING_BACKEND) {
            'azure-key-vault' {
              $relic = Join-Path $signing 'relic.exe'
              Invoke-WebRequest 'https://github.com/sassoftware/relic/releases/download/v8.2.0/relic-windows-amd64.exe' -OutFile $relic
              if ((Get-FileHash $relic -Algorithm SHA256).Hash.ToLowerInvariant() -ne '1411ca46a792483f200b744df9fba20bb32179d831f77264d8157f0f445a6082') { throw 'relic checksum mismatch' }
              & $relic --version
              if ($LASTEXITCODE -ne 0) { throw 'relic cannot start on this runner' }
              @{ tokens = @{ azure = @{ type = 'azure'; pin = '' } }; keys = @{ azure = @{ token = 'azure'; id = $env:AZURE_KEY_VAULT_CERTIFICATE_URL; timestamp = $true } }; timestamp = @{ urls = @('http://timestamp.acs.microsoft.com') } } |
                ConvertTo-Json -Depth 6 | Set-Content -Encoding utf8NoBOM $configPath
              "RELIC_PATH=$relic" >> $env:GITHUB_ENV
            }
            'artifact-signing' {
              $package = Join-Path $signing 'client.zip'
              Invoke-WebRequest 'https://api.nuget.org/v3-flatcontainer/microsoft.artifactsigning.client/1.0.146/microsoft.artifactsigning.client.1.0.146.nupkg' -OutFile $package
              if ((Get-FileHash $package -Algorithm SHA256).Hash.ToLowerInvariant() -ne '7761e5d8f31e54b764da21d33cd8b0a2940e1b05526c7dfcb5e94b0431426f70') { throw 'Artifact Signing client checksum mismatch' }
              Expand-Archive $package -DestinationPath (Join-Path $signing 'client')
              $dlib = Join-Path $signing 'client/bin/x64/Azure.CodeSigning.Dlib.dll'
              if (-not (Test-Path -LiteralPath $dlib)) { throw 'x64 Artifact Signing dlib missing' }
              $kits = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits/10/bin'
              $signtool = Get-ChildItem $kits -Filter signtool.exe -File -Recurse |
                Where-Object { $_.Directory.Name -eq 'x64' -and [version]$_.Directory.Parent.Name -ge [version]'10.0.22621.755' } |
                Sort-Object { [version]$_.Directory.Parent.Name } -Descending | Select-Object -First 1
              if (-not $signtool) { throw 'Compatible x64 SignTool missing' }
              $runtime = Join-Path $signing 'dotnet.zip'
              Invoke-WebRequest 'https://builds.dotnet.microsoft.com/dotnet/Runtime/8.0.32/dotnet-runtime-8.0.32-win-x64.zip' -OutFile $runtime
              if ((Get-FileHash $runtime -Algorithm SHA512).Hash.ToLowerInvariant() -ne 'f0349e793d8081c682c01d736db695c9c1ec268c6173648913543db219e44cbf2e952c7ef94fc37946b0f2bb95ca1898d972a43591b8e44d5a1659f4911904c0') { throw '.NET runtime checksum mismatch' }
              $dotnet = Join-Path $signing 'dotnet-x64'
              Expand-Archive $runtime -DestinationPath $dotnet
              "DOTNET_ROOT=$dotnet" >> $env:GITHUB_ENV
              "DOTNET_ROOT_X64=$dotnet" >> $env:GITHUB_ENV
              "SIGNTOOL_PATH=$($signtool.FullName)" >> $env:GITHUB_ENV
              "ARTIFACT_SIGNING_DLIB_PATH=$dlib" >> $env:GITHUB_ENV
              $configPath = Join-Path $signing 'metadata.json'
              @{ Endpoint = $env:ARTIFACT_SIGNING_ENDPOINT; CodeSigningAccountName = $env:ARTIFACT_SIGNING_ACCOUNT; CertificateProfileName = $env:ARTIFACT_SIGNING_CERTIFICATE_PROFILE; ExcludeCredentials = @('EnvironmentCredential', 'WorkloadIdentityCredential', 'ManagedIdentityCredential', 'SharedTokenCacheCredential', 'VisualStudioCredential', 'VisualStudioCodeCredential', 'AzurePowerShellCredential', 'AzureDeveloperCliCredential', 'InteractiveBrowserCredential') } |
                ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8NoBOM $configPath
            }
          }
          "WINDOWS_SIGNING_CONFIG=$configPath" >> $env:GITHUB_ENV

      - name: macOS signing keychain
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_SIGNING_IDENTITY" ] \
            || { echo "::error::Developer ID signing is required"; exit 1; }
          printf '%s' "$APPLE_CERTIFICATE" | base64 -d > "$RUNNER_TEMP/echo-sign.p12"
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security import "$RUNNER_TEMP/echo-sign.p12" -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci build.keychain > /dev/null
          rm -f "$RUNNER_TEMP/echo-sign.p12"

      - name: Configure explicitly enabled macOS notarization
        if: runner.os == 'macOS' && vars.APPLE_NOTARIZE_METHOD != ''
        shell: bash
        env:
          APPLE_NOTARIZE_METHOD: ${{ vars.APPLE_NOTARIZE_METHOD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          case "$APPLE_SIGNING_IDENTITY" in "Developer ID Application:"*) ;; *) exit 1;; esac
          case "$APPLE_NOTARIZE_METHOD" in
            apple-id)
              [ -n "$APPLE_ID" ] && [ -n "$APPLE_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]
              printf 'APPLE_ID=%s\nAPPLE_PASSWORD=%s\nAPPLE_TEAM_ID=%s\n' "$APPLE_ID" "$APPLE_PASSWORD" "$APPLE_TEAM_ID" >> "$GITHUB_ENV"
              ;;
            api-key)
              [ -n "$APPLE_API_ISSUER" ] && [ -n "$APPLE_API_KEY" ] && [ -n "$APPLE_API_PRIVATE_KEY" ]
              api_key_path="$RUNNER_TEMP/notarization-key.p8"
              umask 077
              printf '%s\n' "$APPLE_API_PRIVATE_KEY" > "$api_key_path"
              printf 'APPLE_API_ISSUER=%s\nAPPLE_API_KEY=%s\nAPPLE_API_KEY_PATH=%s\n' "$APPLE_API_ISSUER" "$APPLE_API_KEY" "$api_key_path" >> "$GITHUB_ENV"
              ;;
            *) echo "::error::Unknown APPLE_NOTARIZE_METHOD"; exit 1 ;;
          esac

      - name: Bundle and sign without executing private source
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          cd "$BUNDLE_ROOT"
          bash "$GITHUB_WORKSPACE/_release-ci/scripts/run-confidential.sh" \
            "$TAURI_CLI" bundle --ci --bundles "${{ matrix.bundles }}" \
            ${{ matrix.args }} --config "$TRUSTED_BUNDLE_CONFIG"

      # Since macOS 26 the app icon ships as Contents/Resources/Assets.car plus
      # CFBundleIconName. Tauri skips that step with only a log line when the
      # toolchain cannot produce it, and the app silently shows the legacy icon.
      - name: Verify macOS app icon (Assets.car and CFBundleIconName)
        if: matrix.runner == 'macos-15'
        shell: bash
        run: |
          set -euo pipefail
          root="$BUNDLE_ROOT/${{ matrix.target_dir }}/bundle"
          app=$(find "$root/macos" -maxdepth 1 -name '*.app' -print -quit)
          test -n "$app" || { echo "::error::no .app bundle found"; exit 1; }
          python3 _release-ci/scripts/verify-macos-app-icon.py "$BUNDLE_ROOT/src-tauri/tauri.conf.json" "$app"

      - name: Verify enabled Windows signing before upload
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:BUNDLE_ROOT '${{ matrix.target_dir }}'
          $files = @(Get-ChildItem $root -Filter '*.exe' -File; Get-ChildItem "$root/bundle/nsis" -Filter '*.exe' -File) |
            Sort-Object FullName -Unique
          if ($files.Count -lt 2) { throw 'Application and NSIS installer must both exist' }
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature -LiteralPath $file.FullName
            if ($signature.Status -ne 'Valid' -or -not $signature.SignerCertificate -or
                $signature.SignerCertificate.Subject -cne $env:WINDOWS_PUBLISHER -or
                -not $signature.TimeStamperCertificate) { throw 'Windows artifact failed Authenticode verification' }
          }

      - name: Verify explicitly enabled macOS notarization
        if: runner.os == 'macOS' && vars.APPLE_NOTARIZE_METHOD != ''
        shell: bash
        run: |
          set -euo pipefail
          root="$BUNDLE_ROOT/${{ matrix.target_dir }}/bundle"
          app=$(find "$root/macos" -maxdepth 1 -name '*.app' -print -quit)
          dmg=$(find "$root/dmg" -maxdepth 1 -name '*.dmg' -print -quit)
          test -n "$app" && test -n "$dmg"
          codesign --verify --deep --strict "$app"
          xcrun stapler validate "$app"
          xcrun stapler validate "$dmg"

      - name: Stage canonical release asset names
        shell: bash
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          root="$BUNDLE_ROOT/${{ matrix.target_dir }}/bundle"
          destination="$RUNNER_TEMP/release-assets"
          mkdir "$destination"
          one() {
            local directory="$1" pattern="$2" first second
            first=$(find "$directory" -maxdepth 1 -type f -name "$pattern" -print -quit)
            [ -n "$first" ] || return 1
            second=$(find "$directory" -maxdepth 1 -type f -name "$pattern" ! -path "$first" -print -quit)
            [ -z "$second" ] || return 1
            printf '%s\n' "$first"
          }
          case "${{ matrix.artifact }}" in
            linux-x64)
              source=$(one "$root/appimage" '*.AppImage')
              cp "$source" "$destination/echo_${version}_amd64.AppImage"
              cp "$source.sig" "$destination/echo_${version}_amd64.AppImage.sig"
              ;;
            windows-x64)
              source=$(one "$root/nsis" '*.exe')
              cp "$source" "$destination/echo_${version}_x64-setup.exe"
              cp "$source.sig" "$destination/echo_${version}_x64-setup.exe.sig"
              ;;
            windows-arm64)
              source=$(one "$root/nsis" '*.exe')
              cp "$source" "$destination/echo_${version}_arm64-setup.exe"
              cp "$source.sig" "$destination/echo_${version}_arm64-setup.exe.sig"
              ;;
            macos-arm64)
              archive=$(one "$root/macos" '*.app.tar.gz')
              dmg=$(one "$root/dmg" '*.dmg')
              cp "$archive" "$destination/echo_aarch64.app.tar.gz"
              cp "$archive.sig" "$destination/echo_aarch64.app.tar.gz.sig"
              cp "$dmg" "$destination/echo_${version}_aarch64.dmg"
              ;;
            *) exit 1 ;;
          esac

      - name: Remove notarization API key
        if: always() && runner.os == 'macOS' && vars.APPLE_NOTARIZE_METHOD == 'api-key'
        shell: bash
        run: rm -f -- "$RUNNER_TEMP/notarization-key.p8"

      - name: Upload only canonical signed assets to the reserved draft
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RELEASE_ID: ${{ needs.reserve.outputs.release_id }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          # Contract aliases retained for the numeric reserved release handoff:
          # releaseId: ${{ needs.reserve.outputs.release_id }}
          # prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          [[ "$RELEASE_ID" =~ ^[1-9][0-9]*$ ]]
          version="${TAG#v}"
          case "${{ matrix.artifact }}" in
            linux-x64) names=("echo_${version}_amd64.AppImage" "echo_${version}_amd64.AppImage.sig") ;;
            windows-x64) names=("echo_${version}_x64-setup.exe" "echo_${version}_x64-setup.exe.sig") ;;
            windows-arm64) names=("echo_${version}_arm64-setup.exe" "echo_${version}_arm64-setup.exe.sig") ;;
            macos-arm64) names=("echo_aarch64.app.tar.gz" "echo_aarch64.app.tar.gz.sig" "echo_${version}_aarch64.dmg") ;;
            *) exit 1 ;;
          esac
          release=$(gh api "repos/$REPO/releases/$RELEASE_ID")
          for name in "${names[@]}"; do
            ids=$(jq -r --arg name "$name" '.assets[] | select(.name == $name) | .id' <<<"$release")
            [ "$(wc -w <<<"$ids" | tr -d ' ')" -le 1 ] || { echo "::error::duplicate existing asset $name"; exit 1; }
            [ -z "$ids" ] || gh api -X DELETE "repos/$REPO/releases/assets/$ids"
            python "$GITHUB_WORKSPACE/_release-ci/scripts/upload-release-asset.py" \
              "$REPO" "$RELEASE_ID" "$name" "$RUNNER_TEMP/release-assets/$name" >/dev/null
          done

  verify_updater_trust:
    needs: [prepare, reserve, build]
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: ubuntu-24.04
    # GitHub exposes unpublished draft releases only to push-capable tokens.
    # The verifier remains read-only; the workflow contract forbids mutations.
    permissions:
      contents: write
    outputs:
      evidence: ${{ steps.verify.outputs.evidence }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install Minisign
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign
      - name: Checkout the exact source commit that was built
        env:
          DEPLOY_KEY: ${{ secrets.ECHO_TAURI_DEPLOY_KEY }}
          REF: ${{ needs.prepare.outputs.ref }}
          SOURCE_COMMIT: ${{ needs.prepare.outputs.source_commit }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/echo_ci
          chmod 600 ~/.ssh/echo_ci
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/echo_ci -o StrictHostKeyChecking=accept-new"
          if [[ "$REF" =~ ^[0-9a-f]{40}$ ]]; then
            git init _source >/dev/null 2>&1 || { echo "::error::private source checkout failed"; exit 1; }
            git -C _source remote add origin "git@github.com:$SOURCE_REPO.git" >/dev/null 2>&1 || { echo "::error::private source checkout failed"; exit 1; }
            git -C _source fetch --depth 1 origin "$SOURCE_COMMIT" >/dev/null 2>&1 || { echo "::error::private source checkout failed"; exit 1; }
            git -C _source checkout --detach FETCH_HEAD >/dev/null 2>&1 || { echo "::error::private source checkout failed"; exit 1; }
          else
            git clone --depth 1 --branch "$REF" "git@github.com:$SOURCE_REPO.git" _source >/dev/null 2>&1 || { echo "::error::private source checkout failed"; exit 1; }
          fi
          rm -f ~/.ssh/echo_ci
          [ "$(git -C _source rev-parse HEAD)" = "$SOURCE_COMMIT" ] \
            || { echo "::error::source tag moved after prepare"; exit 1; }
          expected="${TAG#v}"
          bash scripts/run-confidential.sh bash -s -- "$expected" <<'VERSION'
          set -euo pipefail
          actual=$(jq -r '.version // empty' _source/src-tauri/tauri.conf.json)
          [ "$actual" = "$1" ]
          VERSION
      - id: verify
        name: Cryptographically verify four updater pairs and record IDs + hashes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RELEASE_ID: ${{ needs.reserve.outputs.release_id }}
          TAG: ${{ needs.prepare.outputs.tag }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          set -euo pipefail
          source scripts/release-assets.sh
          release_assets_load "$REPO" "$RELEASE_ID" "$TAG" "$PRERELEASE"
          evidence_dir=$(mktemp -d "${RUNNER_TEMP}/echo-updater-evidence.XXXXXX")
          download_dir=$(mktemp -d "${RUNNER_TEMP}/echo-updater-download.XXXXXX")
          version="${TAG#v}"
          mac="echo_aarch64.app.tar.gz"
          linux="echo_${version}_amd64.AppImage"
          win64="echo_${version}_x64-setup.exe"
          winarm="echo_${version}_arm64-setup.exe"

          names=("$mac" "$linux" "$win64" "$winarm")
          signed_names=("echo.app.tar.gz" "$linux" "$win64" "$winarm")
          ids=()
          sig_ids=()
          for name in "${names[@]}"; do
            release_asset_download "$name" "$download_dir/$name"
            ids+=("$RELEASE_ASSET_LAST_ID")
            release_asset_download "$name.sig" "$download_dir/$name.sig"
            sig_ids+=("$RELEASE_ASSET_LAST_ID")
          done

          bash scripts/run-confidential.sh python3 scripts/verify-updater-signatures.py \
            --config _source/src-tauri/tauri.conf.json \
            --evidence-dir "$evidence_dir/minisign" \
            --output-json "$evidence_dir/verified.json" \
            --pair "${signed_names[0]}" "$download_dir/${names[0]}" "$download_dir/${names[0]}.sig" \
            --pair "${signed_names[1]}" "$download_dir/${names[1]}" "$download_dir/${names[1]}.sig" \
            --pair "${signed_names[2]}" "$download_dir/${names[2]}" "$download_dir/${names[2]}.sig" \
            --pair "${signed_names[3]}" "$download_dir/${names[3]}" "$download_dir/${names[3]}.sig"

          evidence=$(jq -cn \
            --slurpfile verified "$evidence_dir/verified.json" \
            --arg mac "$mac" --arg mac_id "${ids[0]}" --arg mac_sig_id "${sig_ids[0]}" \
            --arg linux "$linux" --arg linux_id "${ids[1]}" --arg linux_sig_id "${sig_ids[1]}" \
            --arg win64 "$win64" --arg win64_id "${ids[2]}" --arg win64_sig_id "${sig_ids[2]}" \
            --arg winarm "$winarm" --arg winarm_id "${ids[3]}" --arg winarm_sig_id "${sig_ids[3]}" \
            'def item($index; $name; $id; $sig_id): {
               name: $name, id: ($id | tonumber), sha256: $verified[0].pairs[$index].artifact_sha256,
               sig_name: ($name + ".sig"), sig_id: ($sig_id | tonumber),
               sig_sha256: $verified[0].pairs[$index].signature_sha256,
               signed_filename: $verified[0].pairs[$index].signed_filename
             };
             {public_key_sha256: $verified[0].public_key_sha256,
              mac: item(0; $mac; $mac_id; $mac_sig_id),
              linux: item(1; $linux; $linux_id; $linux_sig_id),
              windows_x64: item(2; $win64; $win64_id; $win64_sig_id),
              windows_arm64: item(3; $winarm; $winarm_id; $winarm_sig_id)}')
          echo "evidence=$evidence" >> "$GITHUB_OUTPUT"
          echo "updater evidence retained: $evidence_dir"

  verify_macos_platform_trust:
    needs: [prepare, reserve, build]
    if: needs.prepare.outputs.should_build == 'true' && needs.prepare.outputs.requires_platform_trust == 'true'
    runs-on: macos-15
    # GitHub exposes unpublished draft releases only to push-capable tokens.
    # The verifier remains read-only; the workflow contract forbids mutations.
    permissions:
      contents: write
    outputs:
      app_archive_sha256: ${{ steps.verify.outputs.app_archive_sha256 }}
      dmg_sha256: ${{ steps.verify.outputs.dmg_sha256 }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - id: verify
        name: Download and verify canonical macOS artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RELEASE_ID: ${{ needs.reserve.outputs.release_id }}
          TAG: ${{ needs.prepare.outputs.tag }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_SIGNING_AUTHORITY: ${{ vars.APPLE_SIGNING_AUTHORITY }}
        run: |
          set -euo pipefail
          [ -n "$APPLE_TEAM_ID" ] || { echo "::error::repository variable APPLE_TEAM_ID is required for v1+"; exit 1; }
          [ -n "$APPLE_SIGNING_AUTHORITY" ] || { echo "::error::repository variable APPLE_SIGNING_AUTHORITY is required for v1+"; exit 1; }
          source scripts/release-assets.sh
          release_assets_load "$REPO" "$RELEASE_ID" "$TAG" "$PRERELEASE"

          work_dir=$(mktemp -d "${RUNNER_TEMP}/echo-macos-download.XXXXXX")
          version="${TAG#v}"
          app_archive="echo_aarch64.app.tar.gz"
          dmg="echo_${version}_aarch64.dmg"
          release_asset_download "$app_archive" "$work_dir/$app_archive"
          release_asset_download "$dmg" "$work_dir/$dmg"
          bash scripts/verify-platform-macos.sh \
            "$work_dir/$app_archive" "$work_dir/$dmg" \
            "ai.subunit.echo" "$version" "$APPLE_TEAM_ID" "$APPLE_SIGNING_AUTHORITY"
          printf 'app_archive_sha256=%s\n' "$(shasum -a 256 "$work_dir/$app_archive" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          printf 'dmg_sha256=%s\n' "$(shasum -a 256 "$work_dir/$dmg" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

  verify_windows_platform_trust:
    needs: [prepare, reserve, build]
    if: needs.prepare.outputs.should_build == 'true' && needs.prepare.outputs.requires_platform_trust == 'true'
    runs-on: windows-latest
    # GitHub exposes unpublished draft releases only to push-capable tokens.
    # The verifier remains read-only; the workflow contract forbids mutations.
    permissions:
      contents: write
    outputs:
      x64_sha256: ${{ steps.verify.outputs.x64_sha256 }}
      arm64_sha256: ${{ steps.verify.outputs.arm64_sha256 }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Download exact artifacts from canonical draft
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RELEASE_ID: ${{ needs.reserve.outputs.release_id }}
          TAG: ${{ needs.prepare.outputs.tag }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
          WINDOWS_PUBLISHER: ${{ vars.WINDOWS_PUBLISHER }}
        run: |
          set -euo pipefail
          [ -n "$WINDOWS_PUBLISHER" ] || { echo "::error::repository variable WINDOWS_PUBLISHER is required for v1+"; exit 1; }
          source scripts/release-assets.sh
          release_assets_load "$REPO" "$RELEASE_ID" "$TAG" "$PRERELEASE"

          mkdir .platform-trust
          version="${TAG#v}"
          win64="echo_${version}_x64-setup.exe"
          winarm="echo_${version}_arm64-setup.exe"
          release_asset_download "$win64" ".platform-trust/$win64"
          release_asset_download "$winarm" ".platform-trust/$winarm"

      - id: verify
        name: Verify Windows Authenticode trust, versions, and hashes
        shell: pwsh
        env:
          WINDOWS_PUBLISHER: ${{ vars.WINDOWS_PUBLISHER }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          $version = $env:TAG.Substring(1)
          $win64 = Join-Path $env:GITHUB_WORKSPACE ".platform-trust/echo_${version}_x64-setup.exe"
          $winarm = Join-Path $env:GITHUB_WORKSPACE ".platform-trust/echo_${version}_arm64-setup.exe"
          & ./scripts/verify-platform-windows.ps1 -ExpectedPublisher $env:WINDOWS_PUBLISHER -ExpectedVersion $version -ArtifactPath @($win64, $winarm)
          $x64Hash = (Get-FileHash -LiteralPath $win64 -Algorithm SHA256).Hash.ToLowerInvariant()
          $arm64Hash = (Get-FileHash -LiteralPath $winarm -Algorithm SHA256).Hash.ToLowerInvariant()
          "x64_sha256=$x64Hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "arm64_sha256=$arm64Hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

  platform_trust:
    needs: [prepare, reserve, build, verify_updater_trust, verify_macos_platform_trust, verify_windows_platform_trust]
    if: always() && needs.prepare.outputs.should_build == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-24.04
    outputs:
      updater_evidence: ${{ steps.gate.outputs.updater_evidence }}
      app_archive_sha256: ${{ steps.gate.outputs.app_archive_sha256 }}
      dmg_sha256: ${{ steps.gate.outputs.dmg_sha256 }}
      windows_x64_sha256: ${{ steps.gate.outputs.windows_x64_sha256 }}
      windows_arm64_sha256: ${{ steps.gate.outputs.windows_arm64_sha256 }}
    steps:
      - id: gate
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          REQUIRED: ${{ needs.prepare.outputs.requires_platform_trust }}
          UPDATER_RESULT: ${{ needs.verify_updater_trust.result }}
          UPDATER_EVIDENCE: ${{ needs.verify_updater_trust.outputs.evidence }}
          MAC_RESULT: ${{ needs.verify_macos_platform_trust.result }}
          WINDOWS_RESULT: ${{ needs.verify_windows_platform_trust.result }}
          MAC_APP_HASH: ${{ needs.verify_macos_platform_trust.outputs.app_archive_sha256 }}
          MAC_DMG_HASH: ${{ needs.verify_macos_platform_trust.outputs.dmg_sha256 }}
          WINDOWS_X64_HASH: ${{ needs.verify_windows_platform_trust.outputs.x64_sha256 }}
          WINDOWS_ARM64_HASH: ${{ needs.verify_windows_platform_trust.outputs.arm64_sha256 }}
        run: |
          set -euo pipefail
          [ "$UPDATER_RESULT" = success ] \
            || { echo "::error::updater signature trust result is $UPDATER_RESULT"; exit 1; }
          version="${TAG#v}"
          expected_mac="echo_aarch64.app.tar.gz"
          expected_linux="echo_${version}_amd64.AppImage"
          expected_win64="echo_${version}_x64-setup.exe"
          expected_winarm="echo_${version}_arm64-setup.exe"
          jq -e \
            --arg mac "$expected_mac" --arg linux "$expected_linux" \
            --arg win64 "$expected_win64" --arg winarm "$expected_winarm" \
            '(.public_key_sha256 | test("^[0-9a-f]{64}$")) and
             (.mac.name == $mac and .mac.signed_filename == "echo.app.tar.gz") and
             (.linux.name == $linux and .linux.signed_filename == $linux) and
             (.windows_x64.name == $win64 and .windows_x64.signed_filename == $win64) and
             (.windows_arm64.name == $winarm and .windows_arm64.signed_filename == $winarm) and
             ([.mac, .linux, .windows_x64, .windows_arm64] | all(
               (.id | type == "number" and . > 0) and
               (.sig_id | type == "number" and . > 0) and
               (.sig_name == (.name + ".sig")) and
               (.sha256 | test("^[0-9a-f]{64}$")) and
               (.sig_sha256 | test("^[0-9a-f]{64}$"))))' \
            <<<"$UPDATER_EVIDENCE" >/dev/null \
            || { echo "::error::updater verifier returned malformed or mismatched evidence"; exit 1; }
          echo "updater_evidence=$UPDATER_EVIDENCE" >> "$GITHUB_OUTPUT"

          case "$REQUIRED" in
            false)
              echo "0.x release: cryptographic updater gate passed; native platform trust is not required by policy"
              ;;
            true)
              [ "$MAC_RESULT" = success ] \
                || { echo "::error::macOS platform trust result is $MAC_RESULT"; exit 1; }
              [ "$WINDOWS_RESULT" = success ] \
                || { echo "::error::Windows platform trust result is $WINDOWS_RESULT"; exit 1; }
              for hash in "$MAC_APP_HASH" "$MAC_DMG_HASH" "$WINDOWS_X64_HASH" "$WINDOWS_ARM64_HASH"; do
                [[ "$hash" =~ ^[0-9a-f]{64}$ ]] \
                  || { echo "::error::platform trust job returned an invalid SHA-256"; exit 1; }
              done
              [ "$(jq -r '.mac.sha256' <<<"$UPDATER_EVIDENCE")" = "$MAC_APP_HASH" ] \
                || { echo "::error::macOS native and updater checks covered different bytes"; exit 1; }
              [ "$(jq -r '.windows_x64.sha256' <<<"$UPDATER_EVIDENCE")" = "$WINDOWS_X64_HASH" ] \
                || { echo "::error::Windows x64 native and updater checks covered different bytes"; exit 1; }
              [ "$(jq -r '.windows_arm64.sha256' <<<"$UPDATER_EVIDENCE")" = "$WINDOWS_ARM64_HASH" ] \
                || { echo "::error::Windows ARM64 native and updater checks covered different bytes"; exit 1; }
              printf 'app_archive_sha256=%s\ndmg_sha256=%s\n' "$MAC_APP_HASH" "$MAC_DMG_HASH" >> "$GITHUB_OUTPUT"
              printf 'windows_x64_sha256=%s\nwindows_arm64_sha256=%s\n' \
                "$WINDOWS_X64_HASH" "$WINDOWS_ARM64_HASH" >> "$GITHUB_OUTPUT"
              echo "v1+ updater and native platform trust gates passed"
              ;;
            *)
              echo "::error::release policy returned invalid requires_platform_trust=$REQUIRED"
              exit 1
              ;;
          esac

  publish:
    # Atomar: Publish erst nach kryptografischer Updater-Prüfung aller vier
    # Plattformen und — für v1+ — nativer macOS-/Windows-Verifikation. Alle acht
    # Updater-Dateien werden unmittelbar vor Publish über ID und SHA-256 gebunden.
    needs: [prepare, reserve, build, verify_updater_trust, platform_trust]
    # `always()` is required here: for 0.x the two native platform-verifier jobs
    # are intentionally skipped. GitHub otherwise propagates that transitive
    # skip to this job even though the aggregate platform_trust gate succeeded.
    if: always() && needs.prepare.outputs.should_build == 'true' && needs.verify_updater_trust.result == 'success' && needs.platform_trust.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Assemble + validate latest.json; publish Stable or retain Draft RC
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRUST_REQUIRED: ${{ needs.prepare.outputs.requires_platform_trust }}
          UPDATER_EVIDENCE: ${{ needs.verify_updater_trust.outputs.evidence }}
          VERIFIED_MAC_APP_SHA256: ${{ needs.platform_trust.outputs.app_archive_sha256 }}
          VERIFIED_MAC_DMG_SHA256: ${{ needs.platform_trust.outputs.dmg_sha256 }}
          VERIFIED_WINDOWS_X64_SHA256: ${{ needs.platform_trust.outputs.windows_x64_sha256 }}
          VERIFIED_WINDOWS_ARM64_SHA256: ${{ needs.platform_trust.outputs.windows_arm64_sha256 }}
        run: |
          set -euo pipefail
          tag="${{ needs.prepare.outputs.tag }}"
          id="${{ needs.reserve.outputs.release_id }}"
          mode="${{ needs.prepare.outputs.release_mode }}"
          prerelease="${{ needs.prepare.outputs.prerelease }}"
          repo="${{ github.repository }}"
          now="$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
          base_url="https://github.com/$repo/releases/download/$tag"
          source scripts/release-assets.sh
          release_assets_load "$repo" "$id" "$tag" "$prerelease"

          verify_hash() {
            local path="$1" expected="$2" label="$3"
            [[ "$expected" =~ ^[0-9a-f]{64}$ ]] \
              || { echo "::error::missing verified SHA-256 for $label"; exit 1; }
            [ "$(sha256sum "$path" | awk '{print $1}')" = "$expected" ] \
              || { echo "::error::$label changed after trust verification"; exit 1; }
          }

          verify_uploaded_manifest_id() {
            local release_json="$1" expected_id="$2"
            local count actual_id
            count=$(jq '[.assets[] | select(.name == "latest.json")] | length' <<<"$release_json")
            if [ "$count" -ne 1 ]; then
              echo "::error::expected exactly one final latest.json, found $count"
              return 1
            fi
            actual_id=$(jq -r '.assets[] | select(.name == "latest.json") | .id' <<<"$release_json")
            if [ "$actual_id" != "$expected_id" ]; then
              echo "::error::latest.json was replaced after numeric release upload"
              return 1
            fi
          }

          ver="${tag#v}"
          mac="echo_aarch64.app.tar.gz"
          dmg="echo_${ver}_aarch64.dmg"
          lin="echo_${ver}_amd64.AppImage"
          win64="echo_${ver}_x64-setup.exe"
          winarm="echo_${ver}_arm64-setup.exe"
          trust_dir=$(mktemp -d "${RUNNER_TEMP}/echo-trust-recheck.XXXXXX")

          for spec in "mac:$mac" "linux:$lin" "windows_x64:$win64" "windows_arm64:$winarm"; do
            key="${spec%%:*}"
            name="${spec#*:}"
            expected_name=$(jq -r --arg key "$key" '.[$key].name // empty' <<<"$UPDATER_EVIDENCE")
            expected_id=$(jq -r --arg key "$key" '.[$key].id // empty' <<<"$UPDATER_EVIDENCE")
            expected_hash=$(jq -r --arg key "$key" '.[$key].sha256 // empty' <<<"$UPDATER_EVIDENCE")
            expected_sig_id=$(jq -r --arg key "$key" '.[$key].sig_id // empty' <<<"$UPDATER_EVIDENCE")
            expected_sig_hash=$(jq -r --arg key "$key" '.[$key].sig_sha256 // empty' <<<"$UPDATER_EVIDENCE")
            [ "$expected_name" = "$name" ] \
              || { echo "::error::updater evidence name mismatch for $key"; exit 1; }
            release_asset_download "$name" "$trust_dir/$name"
            [ "$RELEASE_ASSET_LAST_ID" = "$expected_id" ] \
              || { echo "::error::$name was replaced after updater verification"; exit 1; }
            verify_hash "$trust_dir/$name" "$expected_hash" "$name"
            release_asset_download "$name.sig" "$trust_dir/$name.sig"
            [ "$RELEASE_ASSET_LAST_ID" = "$expected_sig_id" ] \
              || { echo "::error::$name.sig was replaced after updater verification"; exit 1; }
            verify_hash "$trust_dir/$name.sig" "$expected_sig_hash" "$name.sig"
          done

          case "$TRUST_REQUIRED" in
            false)
              echo "0.x release: updater trust is bound; native platform trust is not required by policy"
              ;;
            true)
              release_asset_download "$dmg" "$trust_dir/$dmg"
              dmg_id="$RELEASE_ASSET_LAST_ID"
              verify_hash "$trust_dir/$mac" "$VERIFIED_MAC_APP_SHA256" "$mac native trust"
              verify_hash "$trust_dir/$dmg" "$VERIFIED_MAC_DMG_SHA256" "$dmg"
              verify_hash "$trust_dir/$win64" "$VERIFIED_WINDOWS_X64_SHA256" "$win64 native trust"
              verify_hash "$trust_dir/$winarm" "$VERIFIED_WINDOWS_ARM64_SHA256" "$winarm native trust"
              ;;
            *)
              echo "::error::invalid platform trust requirement: $TRUST_REQUIRED"
              exit 1
              ;;
          esac

          cat > "$trust_dir/mkmanifest.py" <<'PY'
          import sys, json
          ver, now, base, directory = sys.argv[1:5]
          mac, lin, win64, winarm = sys.argv[5:9]
          def sig(name):
              with open(f"{directory}/{name}.sig", "r", encoding="utf-8") as fh:
                  return fh.read().strip()
          def url(name): return f"{base}/{name}"
          plats = {}
          for k in ("darwin-aarch64", "darwin-aarch64-app"):
              plats[k] = {"signature": sig(mac), "url": url(mac)}
          for k in ("linux-x86_64", "linux-x86_64-appimage"):
              plats[k] = {"signature": sig(lin), "url": url(lin)}
          for k in ("windows-x86_64", "windows-x86_64-nsis"):
              plats[k] = {"signature": sig(win64), "url": url(win64)}
          for k in ("windows-aarch64", "windows-aarch64-nsis"):
              plats[k] = {"signature": sig(winarm), "url": url(winarm)}
          json.dump({"version": ver, "notes": "", "pub_date": now,
                     "platforms": plats}, sys.stdout, indent=2)
          PY

          python3 "$trust_dir/mkmanifest.py" "$ver" "$now" "$base_url" "$trust_dir" \
            "$mac" "$lin" "$win64" "$winarm" > "$trust_dir/latest.json"
          for key in darwin-aarch64 linux-x86_64 windows-x86_64 windows-aarch64; do
            jq -e ".platforms[\"$key\"].url" "$trust_dir/latest.json" >/dev/null \
              || { echo "::error::latest.json missing $key"; exit 1; }
          done

          latest_count=$(jq '[.assets[] | select(.name == "latest.json")] | length' <<<"$RELEASE_ASSETS_JSON")
          [ "$latest_count" -le 1 ] \
            || { echo "::error::canonical draft has duplicate latest.json assets"; exit 1; }
          if [ "$latest_count" -eq 1 ]; then
            latest_id=$(jq -r '.assets[] | select(.name == "latest.json") | .id' <<<"$RELEASE_ASSETS_JSON")
            gh api -X DELETE "repos/$repo/releases/assets/$latest_id"
          fi
          upload_response=$(python3 scripts/upload-release-asset.py \
            "$repo" "$id" latest.json "$trust_dir/latest.json")
          uploaded_latest_id=$(jq -er '.id | select(type == "number" and . > 0)' <<<"$upload_response") \
            || { echo "::error::numeric release upload returned no valid asset id"; exit 1; }

          final=$(gh api "repos/$repo/releases/$id")
          jq -e --argjson id "$id" --arg tag "$tag" --argjson prerelease "$prerelease" \
            '.id == $id and .tag_name == $tag and .draft == true and .prerelease == $prerelease' \
            <<<"$final" >/dev/null \
            || { echo "::error::release $id changed before final publish decision"; exit 1; }
          verify_uploaded_manifest_id "$final" "$uploaded_latest_id"
          for spec in "mac:$mac" "linux:$lin" "windows_x64:$win64" "windows_arm64:$winarm"; do
            key="${spec%%:*}"; name="${spec#*:}"
            expected_id=$(jq -r --arg key "$key" '.[$key].id' <<<"$UPDATER_EVIDENCE")
            expected_sig_id=$(jq -r --arg key "$key" '.[$key].sig_id' <<<"$UPDATER_EVIDENCE")
            [ "$(jq -r --arg name "$name" '.assets[] | select(.name == $name) | .id' <<<"$final")" = "$expected_id" ] \
              || { echo "::error::$name was replaced after hash verification"; exit 1; }
            [ "$(jq -r --arg name "$name.sig" '.assets[] | select(.name == $name) | .id' <<<"$final")" = "$expected_sig_id" ] \
              || { echo "::error::$name.sig was replaced after hash verification"; exit 1; }
          done
          if [ "$TRUST_REQUIRED" = true ]; then
            [ "$(jq -r --arg name "$dmg" '.assets[] | select(.name == $name) | .id' <<<"$final")" = "$dmg_id" ] \
              || { echo "::error::$dmg was replaced after hash verification"; exit 1; }
          fi

          if [ "$mode" = "draft_stable" ]; then
            python3 scripts/held-stable.py seal \
              --repo "$repo" --release-id "$id" --source-commit "${{ needs.prepare.outputs.source_commit }}" \
              --tag "$tag" --run-id "${{ github.run_id }}" --run-attempt "${{ github.run_attempt }}" \
              --updater-evidence "$UPDATER_EVIDENCE" --directory "$trust_dir"
            echo "signed Stable $tag retained as private draft (release $id); Latest unchanged"
          elif [ "$mode" = "draft_rc" ]; then
            [ "$(jq -r '.prerelease' <<<"$final")" = true ] \
              || { echo "::error::RC release $id escaped its draft/prerelease boundary"; exit 1; }
            echo "signed RC $tag retained as private draft (release $id); Latest unchanged"
          else
            gh api -X PATCH "repos/$repo/releases/$id" \
              -F draft=false -F prerelease=false -f make_latest=true > /dev/null
            echo "published $tag as normal GitHub Latest (release $id) on $repo"
          fi
