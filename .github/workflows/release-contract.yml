name: release-contract

on:
  pull_request:
    paths:
      - ".github/workflows/build.yml"
      - ".github/workflows/pr-check.yml"
      - ".github/workflows/release-contract.yml"
      - "scripts/release_policy.sh"
      - "scripts/held-stable.py"
      - ".github/workflows/promote-stable.yml"
      - "tests/test_held_stable.py"
      - "scripts/release-assets.sh"
      - "scripts/verify-updater-signatures.py"
      - "scripts/upload-release-asset.py"
      - "scripts/validate-macos-app-archive.py"
      - "scripts/verify-macos-app-icon.py"
      - "scripts/probe-deploy-key.sh"
      - ".github/workflows/deploy-key-probe.yml"
      - "tests/test_deploy_key_probe.py"
      - "tests/fixtures/app-icon/**"
      - "scripts/verify-platform-macos.sh"
      - "scripts/verify-platform-windows.ps1"
      - "tests/test_release_workflow.py"
      - "tests/test_confidential_output.py"
      - "tests/fixtures/confidential-hosted/**"
      - "tests/fixtures/windows-native-probe/**"
      - "scripts/run-confidential.sh"
      - ".github/actions/confidential-tauri/**"
      - "README.md"
      - "docs/PLATFORM-TRUST.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/build.yml"
      - ".github/workflows/pr-check.yml"
      - ".github/workflows/release-contract.yml"
      - "scripts/release_policy.sh"
      - "scripts/held-stable.py"
      - ".github/workflows/promote-stable.yml"
      - "tests/test_held_stable.py"
      - "scripts/release-assets.sh"
      - "scripts/verify-updater-signatures.py"
      - "scripts/upload-release-asset.py"
      - "scripts/validate-macos-app-archive.py"
      - "scripts/verify-macos-app-icon.py"
      - "scripts/probe-deploy-key.sh"
      - ".github/workflows/deploy-key-probe.yml"
      - "tests/test_deploy_key_probe.py"
      - "tests/fixtures/app-icon/**"
      - "scripts/verify-platform-macos.sh"
      - "scripts/verify-platform-windows.ps1"
      - "tests/test_release_workflow.py"
      - "tests/test_confidential_output.py"
      - "tests/fixtures/confidential-hosted/**"
      - "tests/fixtures/windows-native-probe/**"
      - "scripts/run-confidential.sh"
      - ".github/actions/confidential-tauri/**"
      - "README.md"
      - "docs/PLATFORM-TRUST.md"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install Minisign for behavioral signature tests
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign
      - run: python -m unittest discover -s tests -v

  windows-native-toolchain:
    # Public crates only (no private checkout, credentials, artifacts or release).
    # Replays the Windows toolchain steps of build.yml verbatim on the same runner
    # images and builds the release's native dependencies (whisper.cpp/ggml and
    # libopus) at the release versions, so a toolchain change shows its compiler
    # diagnostics here instead of behind the confidential release build.
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            features: gpu
          - platform: windows-11-arm
            features: ""
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      # ---- begin: verbatim copy of the Windows toolchain steps in build.yml ----
      - name: LLVM x64 + CMake + Ninja (Windows x64)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          # The MSVC STL of the runner image accepts only a matching Clang
          # (MSVC 14.52 / VS 18.12: Clang 22 or newer, otherwise STL1000).
          # Clang compiles ggml's vulkan-shaders-gen host tool here, so the
          # image's own LLVM is replaced by a pinned, hash-checked release.
          # Same version as the Windows ARM job.
          $llvm = "$env:RUNNER_TEMP\llvm-x64.exe"
          Invoke-WebRequest -Uri "https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.8/LLVM-22.1.8-win64.exe" -OutFile $llvm
          $sha = (Get-FileHash -Algorithm SHA256 $llvm).Hash.ToLower()
          if ($sha -ne "16e5709785fef73c854646241c4a92c5cd574318d1b33c63330dd7721903e55c") { throw "LLVM download hash mismatch: $sha" }
          Start-Process -FilePath $llvm -ArgumentList '/S' -Wait
          $clang = & "C:\Program Files\LLVM\bin\clang-cl.exe" --version
          $clang
          if (-not ($clang -match '^clang version 22\.1\.8(\s|$)')) { throw "LLVM 22.1.8 is not the active LLVM" }
          choco install cmake ninja --no-progress -y --installargs 'ADD_CMAKE_TO_PATH=System'
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Append
          "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          "C:\Program Files\CMake\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          "CMAKE_GENERATOR=Ninja" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Vulkan SDK (Windows x64, GPU whisper — keep glslc for shader gen)
        if: matrix.platform == 'windows-latest'
        uses: jakoch/install-vulkan-sdk-action@37effcfa045411f8bfbbda26df2fd1b3bf3436fa # v1
        with:
          # 1.3.290.0 is no longer offered by LunarG (download 404 since 2026-11). 1.3.296.0 is the
          # oldest SDK still published and stays in the 1.3 line the GPU whisper build was proven on.
          vulkan_version: 1.3.296.0
          install_runtime: true
          cache: true
          stripdown: false

      - name: glslc on PATH (Windows x64)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: '"$env:VULKAN_SDK\Bin" | Out-File -FilePath $env:GITHUB_PATH -Append'

      - name: MSVC env (Windows x64 — Ninja needs cl + INCLUDE/LIB in the job env)
        if: matrix.platform == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      - name: ARM64 LLVM + CMake + Ninja (Windows ARM — choco LLVM is x64)
        if: matrix.platform == 'windows-11-arm'
        shell: pwsh
        run: |
          # The MSVC STL of the runner image accepts only a matching Clang
          # (MSVC 14.52 / VS 18.12: Clang 22 or newer, otherwise STL1000).
          # Same pinned, hash-checked version as the Windows x64 job.
          $llvm = "$env:RUNNER_TEMP\llvm-arm64.exe"
          Invoke-WebRequest -Uri "https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.8/LLVM-22.1.8-woa64.exe" -OutFile $llvm
          $sha = (Get-FileHash -Algorithm SHA256 $llvm).Hash.ToLower()
          if ($sha -ne "76f44ef1ba6eeb5a65904e9500f042f588fade49952778ce48f0374daa934396") { throw "LLVM download hash mismatch: $sha" }
          Start-Process -FilePath $llvm -ArgumentList '/S' -Wait
          $clang = & "C:\Program Files\LLVM\bin\clang-cl.exe" --version
          $clang
          if (-not ($clang -match '^clang version 22\.1\.8(\s|$)')) { throw "LLVM 22.1.8 is not the active LLVM" }
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Append
          "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          # CMake 4.4.4 from Kitware, pinned by hash — the x86_64 build, on
          # purpose: it runs emulated on ARM64, reports the host as AMD64, and
          # libopus (opusic-sys) then builds as plain C. That is what every
          # green Windows-ARM build had (choco's cmake.install = the x86_64
          # MSI). A native ARM64 CMake (the image's, or the arm64 zip of #14)
          # makes opus take its 32-bit-ARM MSVC detection path, which clang-cl
          # rejects (armcpu.c: undeclared '__emit'). Chocolatey itself is not
          # used: its feed refuses runner IPs at times.
          $cmakeZip = "$env:RUNNER_TEMP\cmake-x64.zip"
          Invoke-WebRequest -Uri "https://github.com/Kitware/CMake/releases/download/v4.4.4/cmake-4.4.4-windows-x86_64.zip" -OutFile $cmakeZip
          $sha = (Get-FileHash -Algorithm SHA256 $cmakeZip).Hash.ToLower()
          if ($sha -ne "bace36e94b31c68ab6fa295f26dfa11219e0701cf7c94b0284a7d1cb13dac536") { throw "CMake download hash mismatch: $sha" }
          Expand-Archive -Path $cmakeZip -DestinationPath "$env:RUNNER_TEMP\cmake" -Force
          $cmakeBin = "$env:RUNNER_TEMP\cmake\cmake-4.4.4-windows-x86_64\bin"
          & "$cmakeBin\cmake.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "CMake 4.4.4 not runnable" }
          "$cmakeBin" | Out-File -FilePath $env:GITHUB_PATH -Append
          choco install ninja --no-progress -y
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) { throw "ninja missing" }
          "CMAKE_GENERATOR=Ninja" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CC=clang-cl" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CXX=clang-cl" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CXXFLAGS=/EHsc" | Out-File -FilePath $env:GITHUB_ENV -Append
          "GGML_CPU_AARCH64=OFF" | Out-File -FilePath $env:GITHUB_ENV -Append
          "GGML_CPU_REPACK=OFF" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: MSVC env for clang-cl (Windows ARM — INCLUDE/LIB for the ARM64 MSVC CRT)
        if: matrix.platform == 'windows-11-arm'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: arm64

      # ---- end: verbatim copy ----

      - name: Toolchain inventory
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          Get-ChildItem "$vs\VC\Auxiliary\Build" -Filter 'Microsoft.VCToolsVersion*.txt' | ForEach-Object { "$($_.Name): $(Get-Content $_.FullName)" }
          "VCToolsVersion=$env:VCToolsVersion"
          "clang-cl: $((Get-Command clang-cl).Source)"
          clang-cl --version
          "cmake: $((Get-Command cmake).Source)"
          cmake --version

      - name: Windows compilers accept the runner's MSVC STL (public probe file)
        shell: pwsh
        working-directory: tests/fixtures/windows-native-probe
        run: |
          foreach ($compiler in 'clang-cl', 'cl') {
            & $compiler /nologo /std:c++17 /EHsc /c stl_smoke.cpp "/Fo$env:RUNNER_TEMP\stl-smoke-$compiler.obj"
            if ($LASTEXITCODE -ne 0) { throw "$compiler rejects the MSVC STL of this runner image" }
          }

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Build the release's native crates with this toolchain
        # pwsh like the release build's node process: Git Bash would put its own
        # link.exe in front of the MSVC linker.
        shell: pwsh
        working-directory: tests/fixtures/windows-native-probe
        env:
          FEATURES: ${{ matrix.features }}
          CARGO_TERM_COLOR: never
        run: |
          $ErrorActionPreference = 'Continue'
          $cargoArgs = @('build', '--release', '--locked')
          if ($env:FEATURES) { $cargoArgs += @('--features', $env:FEATURES) }
          $log = Join-Path $env:RUNNER_TEMP 'native-build.log'
          & cargo @cargoArgs *> $log
          $status = $LASTEXITCODE
          if ($status -eq 0) {
            Get-Content $log -Tail 20
            & .\target\release\windows-native-probe.exe
            if ($LASTEXITCODE -ne 0) { throw "probe binary failed with exit $LASTEXITCODE" }
            exit 0
          }
          '::group::error lines'
          Select-String -Path $log -Pattern 'error(\[|:| C[0-9]| LNK)|STL10|fatal error|FAILED:|CMake Error|panicked' |
            Select-Object -First 150 | ForEach-Object { "$($_.LineNumber): $($_.Line)" }
          '::endgroup::'
          Get-Content $log -Tail 150
          exit $status

  confidential-hosted:
    # Public synthetic data only; no private checkout, credentials, artifacts or release.
    # Match the release build's actual host OS/architectures without invoking that build.
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-24.04, macos-15, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Checkout public pinned upstream for metadata and pre-build probes
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: tauri-apps/tauri-action
          ref: 84b9d35b5fc46c1e45415bdb6144030364f7ebc5
          path: _public-upstream
          persist-credentials: false
      - name: macOS build host provides the pinned Xcode (same pin as build.yml)
        # Der Release-Build pinnt Xcode statt den Image-Standard zu nehmen. Diese Probe läuft bei
        # jedem PR auf demselben Runner-Image und meldet einen fehlenden Pin, bevor ein Release scheitert.
        if: matrix.platform == 'macos-15'
        shell: bash
        run: |
          set -euo pipefail
          pin=$(sed -n 's|^ *xcode_app=\(/Applications/Xcode_[0-9.]*\.app\)$|\1|p' .github/workflows/build.yml)
          [ -n "$pin" ] || { echo "::error::Xcode-Pin in build.yml nicht gefunden"; exit 1; }
          ls -d /Applications/Xcode*.app
          [ -d "$pin" ] || { echo "::error::$pin fehlt im Runner-Image macos-15"; exit 1; }
          DEVELOPER_DIR="$pin/Contents/Developer" xcodebuild -version
      - name: Pinned Xcode verifies a macOS 26 system icon (same pin as build.yml)
        # The release build checks Assets.car with the pinned toolchain's assetutil. This probe
        # proves on the same runner image that it can read a car compiled for macOS 26.
        if: matrix.platform == 'macos-15'
        shell: bash
        run: |
          set -euo pipefail
          pin=$(sed -n 's|^ *xcode_app=\(/Applications/Xcode_[0-9.]*\.app\)$|\1|p' .github/workflows/build.yml)
          [ -n "$pin" ] || { echo "::error::Xcode-Pin in build.yml nicht gefunden"; exit 1; }
          DEVELOPER_DIR="$pin/Contents/Developer" python3 scripts/verify-macos-app-icon.py \
            tests/fixtures/app-icon/tauri.conf.json tests/fixtures/app-icon/Fixture.app
      - name: Prepare public fixture
        shell: bash
        run: node tests/fixtures/confidential-hosted/probe.cjs prepare
      - name: Actual node24 action succeeds with synthetic output
        id: public_success
        uses: ./.github/actions/confidential-tauri
        env:
          PUBLIC_FIXTURE_STATUS: '0'
        with:
          releaseId: '42'
          args: '--public-fixture argument with spaces'
      - name: Actual node24 action retains synthetic failure
        id: public_failure
        continue-on-error: true
        uses: ./.github/actions/confidential-tauri
        env:
          PUBLIC_FIXTURE_STATUS: '37'
        with:
          releaseId: '42'
          args: '--public-fixture argument with spaces'
      - name: Verify runner channels and captured controls using action runtime
        if: always()
        shell: bash
        env:
          PUBLIC_SUCCESS_OUTCOME: ${{ steps.public_success.outcome }}
          PUBLIC_FAILURE_OUTCOME: ${{ steps.public_failure.outcome }}
          PUBLIC_SUCCESS_OUTPUT: ${{ steps.public_success.outputs.releaseId }}
          PUBLIC_FAILURE_OUTPUT: ${{ steps.public_failure.outputs.releaseId }}
        run: node tests/fixtures/confidential-hosted/probe.cjs hosted
