# Nachlauf der automatischen Freigabe: grün darf nie an einem Neustart hängen (TJ 2026-10-24).
#
# Stößt eine fehlgeschlagene oder abgebrochene "Automatische Freigabe" am aktuellen Head neu an,
# - sobald die Freigabe-Tests dort grün durchgelaufen sind (z. B. nach einem Neustart eines
#   wackligen Tests), oder
# - sobald ein Gate-Urteil ("Gate-Urteil: GO <Head-SHA>") als Kommentar eingeht; fehlt am Head
#   dann noch die Bot-Freigabe (z. B. nach einem zurückgenommenen NO-GO), auch nach grünem Lauf.
#
# Ein späteres "Gate-Urteil: NO-GO <Head-SHA>" zieht eine bereits erteilte Bot-Freigabe am
# Head zurück (Job nogo-zuruecknehmen), damit ein NO-GO nicht nur künftige Läufe sperrt.
#
# Ein Neustart nutzt die Workflow-Definition des ursprünglichen Laufs. Deshalb startet der
# Nachlauf nur Läufe neu, die NACH der letzten Änderung an auto-freigabe.yml auf main begonnen
# haben; ältere Läufe könnten eine überholte, schwächere Prüfung wiederholen (Gate 2026-10-24).
#
# SICHERHEIT: Läuft aus main (workflow_run / issue_comment), checkt keinen Code aus, liest
# keine Kommentartexte in Befehle ein und darf nur Läufe neu starten (actions: write).
# Kommentare zählen nur von OWNER/MEMBER/COLLABORATOR, nie von Fremden im öffentlichen Repo.

name: Automatische Freigabe – Nachlauf

on:
  workflow_run:
    workflows: [Freigabe-Tests]
    types: [completed]
  issue_comment:
    types: [created, edited]

permissions: {}

jobs:
  neu-anstossen:
    name: Freigabe neu anstoßen
    if: >-
      (github.event_name == 'workflow_run'
        && github.event.workflow_run.event == 'pull_request'
        && github.event.workflow_run.conclusion == 'success')
      || (github.event_name == 'issue_comment'
        && github.event.issue.pull_request
        && contains(github.event.comment.body, 'Gate-Urteil: GO')
        && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      EREIGNIS: ${{ github.event_name }}
      RUN_SHA: ${{ github.event.workflow_run.head_sha }}
      RUN_PR: ${{ github.event.workflow_run.pull_requests[0].number }}
      KOMMENTAR_PR: ${{ github.event.issue.number }}
    steps:
      - name: Letzte Freigabe am Head prüfen und bei Bedarf neu starten
        run: |
          set -euo pipefail
          if [ "$EREIGNIS" = "workflow_run" ]; then PR="$RUN_PR"; else PR="$KOMMENTAR_PR"; fi
          # Fork-PRs liefern keine PR-Nummer: dort gibt es ohnehin keine automatische Freigabe
          if [ -z "$PR" ]; then echo "Kein PR aus diesem Repo"; exit 0; fi
          read -r state head draft < <(gh api "repos/$REPO/pulls/$PR" -q '[.state, .head.sha, .draft] | @tsv')
          if [ "$state" != "open" ] || [ "$draft" != "false" ]; then echo "PR #$PR nicht offen oder Entwurf"; exit 0; fi
          # ein Testlauf an einem älteren Head zählt nicht
          if [ "$EREIGNIS" = "workflow_run" ] && [ "$RUN_SHA" != "$head" ]; then echo "Testlauf nicht am aktuellen Head"; exit 0; fi
          # ein Kommentar stößt nur an, wenn das letzte Urteil am exakten Head GO ist (wie in auto-freigabe.yml)
          if [ "$EREIGNIS" = "issue_comment" ]; then
            # Abruf allein: ein API-Fehler bricht den Schritt ab (fail-closed), nur "kein Treffer" ist ok
            urteile=$(gh api "repos/$REPO/issues/$PR/comments?per_page=100" --paginate \
              -q '.[] | select(.author_association == "OWNER" or .author_association == "MEMBER" or .author_association == "COLLABORATOR") | .body')
            letztes=$(printf '%s\n' "$urteile" | tr -d '\r' | { grep -E "^Gate-Urteil: (GO|NO-GO) $head([^0-9a-f]|$)" || true; } | tail -n 1)
            case "$letztes" in
              "Gate-Urteil: GO "*) ;;
              *) echo "Letztes Urteil am Head $head ist kein GO, nichts anzustoßen"; exit 0 ;;
            esac
          fi
          letzter=$(gh api "repos/$REPO/actions/workflows/auto-freigabe.yml/runs?head_sha=$head&event=pull_request_target&per_page=100" \
            -q '.workflow_runs | sort_by(.id) | last | select(. != null) | [.id, .status, (.conclusion // "-"), .created_at] | @tsv')
          if [ -z "$letzter" ]; then echo "Noch keine Freigabe am Head $head"; exit 0; fi
          read -r id status conclusion erstellt <<<"$letzter"
          definition=$(gh api "repos/$REPO/commits?sha=main&path=.github/workflows/auto-freigabe.yml&per_page=1" -q '.[0].commit.committer.date')
          # ISO-8601 in UTC ist lexikografisch vergleichbar
          if [[ "$erstellt" < "$definition" ]]; then
            echo "::warning::Freigabe-Lauf $id ($erstellt) stammt von einer älteren Definition ($definition); Neustart würde die alte Prüfung wiederholen. Neu pushen oder PR schließen und wieder öffnen."
            exit 0
          fi
          case "$status/$conclusion" in
            completed/failure|completed/cancelled|completed/timed_out)
              gh api -X POST "repos/$REPO/actions/runs/$id/rerun" >/dev/null
              echo "Freigabe-Lauf $id ($conclusion) am Head $head neu gestartet" ;;
            completed/success)
              # nach einem Gate-Urteil GO: fehlt die Bot-Freigabe am Head (etwa nach NO-GO), neu starten
              freigaben=$(gh api "repos/$REPO/pulls/$PR/reviews?per_page=100" --paginate \
                -q "[.[] | select(.user.login == \"github-actions[bot]\" and .state == \"APPROVED\" and .commit_id == \"$head\")] | length" \
                | awk '{s+=$1} END{print s+0}')
              if [ "$EREIGNIS" = "issue_comment" ] && [ "$freigaben" -eq 0 ]; then
                gh api -X POST "repos/$REPO/actions/runs/$id/rerun" >/dev/null
                echo "Freigabe-Lauf $id grün, aber keine Bot-Freigabe am Head $head: neu gestartet"
              else echo "Freigabe-Lauf $id grün, Freigaben am Head: $freigaben"; fi ;;
            *) echo "Freigabe-Lauf $id ist $status/$conclusion, nichts zu tun" ;;
          esac

  nogo-zuruecknehmen:
    name: Freigabe nach NO-GO zurücknehmen
    if: >-
      github.event_name == 'issue_comment'
      && github.event.issue.pull_request
      && contains(github.event.comment.body, 'Gate-Urteil: NO-GO')
      && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # eigene Gruppe ohne Abbruch: kein anderer Lauf kann die Rücknahme abbrechen (fail-closed);
    # laufende Freigabe-Läufe bricht der Job selbst ab, und auto-freigabe.yml prüft das
    # letzte Urteil unmittelbar vor dem Freigeben noch einmal
    concurrency:
      group: nogo-zuruecknehmen-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      actions: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR: ${{ github.event.issue.number }}
    steps:
      - name: Bot-Freigabe zurückziehen, wenn das letzte Urteil am Head NO-GO ist
        run: |
          set -euo pipefail
          head=$(gh api "repos/$REPO/pulls/$PR" -q .head.sha)
          # gleiche Regel wie in auto-freigabe.yml: das letzte Urteil am exakten Head gilt
          # Abruf allein: ein API-Fehler bricht den Schritt ab (fail-closed), nur "kein Treffer" ist ok
          urteile=$(gh api "repos/$REPO/issues/$PR/comments?per_page=100" --paginate \
            -q '.[] | select(.author_association == "OWNER" or .author_association == "MEMBER" or .author_association == "COLLABORATOR") | .body')
          letztes=$(printf '%s\n' "$urteile" | tr -d '\r' | { grep -E "^Gate-Urteil: (GO|NO-GO) $head([^0-9a-f]|$)" || true; } | tail -n 1)
          case "$letztes" in
            "Gate-Urteil: NO-GO "*) ;;
            *) echo "Letztes Urteil am Head $head ist kein NO-GO, nichts zu tun"; exit 0 ;;
          esac
          # laufende oder wartende Freigabe-Läufe am Head zuerst abbrechen
          # und abwarten, bis sie wirklich beendet sind (Abbruch ist asynchron); sonst Fehler
          offen() { gh api "repos/$REPO/actions/workflows/auto-freigabe.yml/runs?head_sha=$head&per_page=100" \
              -q '.workflow_runs[] | select(.status != "completed") | .id'; }
          for _ in $(seq 1 18); do
            laeufe=$(offen)
            [ -z "$laeufe" ] && break
            for lauf in $laeufe; do
              # 409 = Lauf endet ohnehin gerade; dann reicht das Warten
              gh api -X POST "repos/$REPO/actions/runs/$lauf/cancel" >/dev/null 2>&1 || true
              echo "Freigabe-Lauf $lauf: Abbruch angefordert"
            done
            sleep 10
          done
          if [ -n "$(offen)" ]; then echo "::error::Freigabe-Läufe am Head $head nach 3 min nicht beendet"; exit 1; fi
          ids=$(gh api "repos/$REPO/pulls/$PR/reviews?per_page=100" --paginate \
            -q '.[] | select(.user.login == "github-actions[bot]" and .state == "APPROVED") | .id')
          for id in $ids; do
            gh api -X PUT "repos/$REPO/pulls/$PR/reviews/$id/dismissals" \
              -f message="Gate-Urteil NO-GO am Head $head: automatische Freigabe zurückgezogen." -f event=DISMISS >/dev/null
            echo "Bot-Freigabe $id zurückgezogen"
          done
