name: release-contract

on:
  pull_request:
    paths:
      - ".github/workflows/build.yml"
      - ".github/workflows/pr-check.yml"
      - ".github/workflows/release-contract.yml"
      - "scripts/release_policy.sh"
      - "scripts/held-stable.py"
      - ".github/workflows/promote-stable.yml"
      - "tests/test_held_stable.py"
      - "scripts/release-assets.sh"
      - "scripts/verify-updater-signatures.py"
      - "scripts/upload-release-asset.py"
      - "scripts/validate-macos-app-archive.py"
      - "scripts/verify-macos-app-icon.py"
      - "tests/fixtures/app-icon/**"
      - "scripts/verify-platform-macos.sh"
      - "scripts/verify-platform-windows.ps1"
      - "tests/test_release_workflow.py"
      - "tests/test_confidential_output.py"
      - "tests/fixtures/confidential-hosted/**"
      - "scripts/run-confidential.sh"
      - ".github/actions/confidential-tauri/**"
      - "README.md"
      - "docs/PLATFORM-TRUST.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/build.yml"
      - ".github/workflows/pr-check.yml"
      - ".github/workflows/release-contract.yml"
      - "scripts/release_policy.sh"
      - "scripts/held-stable.py"
      - ".github/workflows/promote-stable.yml"
      - "tests/test_held_stable.py"
      - "scripts/release-assets.sh"
      - "scripts/verify-updater-signatures.py"
      - "scripts/upload-release-asset.py"
      - "scripts/validate-macos-app-archive.py"
      - "scripts/verify-macos-app-icon.py"
      - "tests/fixtures/app-icon/**"
      - "scripts/verify-platform-macos.sh"
      - "scripts/verify-platform-windows.ps1"
      - "tests/test_release_workflow.py"
      - "tests/test_confidential_output.py"
      - "tests/fixtures/confidential-hosted/**"
      - "scripts/run-confidential.sh"
      - ".github/actions/confidential-tauri/**"
      - "README.md"
      - "docs/PLATFORM-TRUST.md"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install Minisign for behavioral signature tests
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign
      - run: python -m unittest discover -s tests -v

  confidential-hosted:
    # Public synthetic data only; no private checkout, credentials, artifacts or release.
    # Match the release build's actual host OS/architectures without invoking that build.
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-24.04, macos-15, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Checkout public pinned upstream for metadata and pre-build probes
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: tauri-apps/tauri-action
          ref: 84b9d35b5fc46c1e45415bdb6144030364f7ebc5
          path: _public-upstream
          persist-credentials: false
      - name: macOS build host provides the pinned Xcode (same pin as build.yml)
        # Der Release-Build pinnt Xcode statt den Image-Standard zu nehmen. Diese Probe läuft bei
        # jedem PR auf demselben Runner-Image und meldet einen fehlenden Pin, bevor ein Release scheitert.
        if: matrix.platform == 'macos-15'
        shell: bash
        run: |
          set -euo pipefail
          pin=$(sed -n 's|^ *xcode_app=\(/Applications/Xcode_[0-9.]*\.app\)$|\1|p' .github/workflows/build.yml)
          [ -n "$pin" ] || { echo "::error::Xcode-Pin in build.yml nicht gefunden"; exit 1; }
          ls -d /Applications/Xcode*.app
          [ -d "$pin" ] || { echo "::error::$pin fehlt im Runner-Image macos-15"; exit 1; }
          DEVELOPER_DIR="$pin/Contents/Developer" xcodebuild -version
      - name: Pinned Xcode verifies a macOS 26 system icon (same pin as build.yml)
        # The release build checks Assets.car with the pinned toolchain's assetutil. This probe
        # proves on the same runner image that it can read a car compiled for macOS 26.
        if: matrix.platform == 'macos-15'
        shell: bash
        run: |
          set -euo pipefail
          pin=$(sed -n 's|^ *xcode_app=\(/Applications/Xcode_[0-9.]*\.app\)$|\1|p' .github/workflows/build.yml)
          [ -n "$pin" ] || { echo "::error::Xcode-Pin in build.yml nicht gefunden"; exit 1; }
          DEVELOPER_DIR="$pin/Contents/Developer" python3 scripts/verify-macos-app-icon.py \
            tests/fixtures/app-icon/tauri.conf.json tests/fixtures/app-icon/Fixture.app
      - name: Prepare public fixture
        shell: bash
        run: node tests/fixtures/confidential-hosted/probe.cjs prepare
      - name: Actual node24 action succeeds with synthetic output
        id: public_success
        uses: ./.github/actions/confidential-tauri
        env:
          PUBLIC_FIXTURE_STATUS: '0'
        with:
          releaseId: '42'
          args: '--public-fixture argument with spaces'
      - name: Actual node24 action retains synthetic failure
        id: public_failure
        continue-on-error: true
        uses: ./.github/actions/confidential-tauri
        env:
          PUBLIC_FIXTURE_STATUS: '37'
        with:
          releaseId: '42'
          args: '--public-fixture argument with spaces'
      - name: Verify runner channels and captured controls using action runtime
        if: always()
        shell: bash
        env:
          PUBLIC_SUCCESS_OUTCOME: ${{ steps.public_success.outcome }}
          PUBLIC_FAILURE_OUTCOME: ${{ steps.public_failure.outcome }}
          PUBLIC_SUCCESS_OUTPUT: ${{ steps.public_success.outputs.releaseId }}
          PUBLIC_FAILURE_OUTPUT: ${{ steps.public_failure.outputs.releaseId }}
        run: node tests/fixtures/confidential-hosted/probe.cjs hosted
