# Echo — PR-Check (tsc + vite + cargo check + cargo test) für das PRIVATE Quell-Repo.
#
# WARUM hier (im PUBLIC echo-releases) statt im privaten echo-tauri:
# GitHub rechnet Actions-Minuten nach dem Repo ab, in dem der Workflow LÄUFT.
# `echo-tauri` ist privat → seine Jobs bekommen keinen Runner mehr (verifiziert
# 2026-08-06: die dispatchten pr-/win-check-Runs 31125729835/31125731121 standen
# 15 min mit `runner_name: ""` und 0 Steps, Job-Conclusion `cancelled`,
# Run-Conclusion `failure`; PR #142 wurde drei Minuten später ungeprüft gemerged).
# `echo-releases` ist public → Minuten GRATIS. Der Quellcode wird per read-only
# Deploy-Key ausgecheckt (bewährtes Muster: build.yml in diesem Repo).
#
# ZWEITER GRUND — im privaten echo-tauri ist ein ECHTES Gate technisch unmöglich:
# Branch-Protection und Rulesets sind auf dem aktuellen Plan für private Repos
# gesperrt (verifiziert: GET /repos/subunit-ai/echo-tauri/branches/main/protection
# — das Repo heißt seit 30.10.2026 Subunit-UG/echo-app —
# und /rulesets → beide HTTP 403 "Upgrade to GitHub Pro or make this repository
# public to enable this feature."). Ein Check dort kann also NIE "required" sein.
# Der einzige wirksame Riegel ist darum client-seitig: scripts/session/ship.sh im
# Quell-Repo startet DIESEN Lauf, wartet auf seine Conclusion und merged nur bei grün.
#
# NICHT das Problem: `on: pull_request`. Das steht in echo-tauris pr-check.yml und
# win-check.yml längst drin (verifiziert an origin/main) und dutzende
# `pull_request`-Runs sind gelaufen. Wer diesen "Fix" nochmal ergänzt, ändert null.
#
# AUSGELÖST VON — so wird dieser Lauf künftig angestossen (EIN Satz):
#   `scripts/session/ship.sh` im Quell-Repo pusht den Branch, startet mit
#   `gh workflow run pr-check.yml -R Subunit-UG/echo-releases -f ref=<branch>`
#   genau diesen Workflow, wartet per `gh run watch --exit-status` auf seine
#   Conclusion und squash-merged NUR bei grün (`--no-wait` ist der bewusste,
#   sichtbare Notausgang).
#
# ──────────────────────────────────────────────────────────────────────────────
# VERTRAULICHE AUSGABE
#
# npm/cargo-Diagnostik einschließlich Tests, Build-Skripten und Code-Frames
# wird vollständig in einem privaten temporären Verzeichnis abgefangen und
# anschließend gelöscht. Öffentlich erscheinen nur fester Status und Exit-Code.
# Der Helfer stammt aus dem öffentlichen CI-Commit, niemals aus echo-tauri.
# Branch-Namen bleiben als dispatch-Input öffentlich: keine Kundennamen verwenden.
#
#   • MASKIERUNG: `ci/log-mask-words.txt` aus dem PRIVATEN Repo wird nach dem
#     Clone eingelesen und jedes Wort per `::add-mask::` registriert, BEVOR
#     irgendein Build-/Test-Schritt läuft. Damit erscheinen Kundennamen, die in
#     Test-Assertions stehen, selbst bei einem ROTEN Test nur als `***`.
#     Die Liste liegt bewusst im privaten Repo — stünde sie hier, hätte dieses
#     public File die Namen ja selbst veröffentlicht.
#     🔴 FAIL-CLOSED: fehlt die Datei oder enthält sie keinen einzigen Eintrag,
#     bricht der Job ab. Vorher war dieser Step ein stiller No-op (`exit 0`) —
#     und weil die Liste zu diesem Zeitpunkt nur auf einem UNGEPUSHTEN lokalen
#     Branch lag, wäre die Maskierung nach dem Merge dauerhaft und unbemerkt
#     aus gewesen. Eine Schutzmaßnahme, die sich still selbst abschaltet, ist
#     keine. Rot heisst hier: erst `main` in den Branch mergen.
#   • KEINE ARTEFAKTE: kein `actions/upload-artifact`, nirgends. Aus einem grünen
#     wie roten Lauf kann nichts Gebautes und kein Quellbaum abfließen — nur Logtext.
#   • KEINE ENV-DUMPS: kein `env`/`printenv`/`set -x` in irgendeinem Step.
#     `set -euo pipefail` ist bewusst OHNE `-x`.
#   • KEIN RUST_BACKTRACE: bewusst NICHT gesetzt. Ein Backtrace würde bei rotem
#     Test zusätzliche Dateipfade und Frames aus privatem Code drucken.
#   • KEINE SIGNING-/SENTRY-SECRETS: dieser Job zieht ausschliesslich
#     ECHO_TAURI_DEPLOY_KEY (read_only: true, verifiziert). APPLE_*, TAURI_SIGNING_*
#     und *_SENTRY_DSN bleibt er nicht an. echo-tauris eigene pr-check/win-check
#     referenzieren `secrets.` kein einziges Mal — der Check braucht keine.
#   • REF-VALIDIERUNG: der dispatch-Input wird gegen einen engen Zeichensatz
#     geprüft, bevor er an git geht (gleiches Muster wie build.yml).
#
# VERTRAULICHKEIT: Compiler-/target-Verzeichnisse aus echo-tauri werden nicht
# gecacht. release-contract.yml akzeptiert öffentliche PRs, und Fork-PRs können
# Default-Branch-Caches workflowübergreifend lesen. Ein bloß dispatch-getriggerter
# Build schützt seine Cache-Inhalte daher nicht. Öffentliche npm-Pakete dürfen
# weiterhin gecacht werden; private Quellen/Compiler-Ausgaben niemals.
# https://docs.github.com/en/actions/reference/workflows-and-actions/dependency-caching
# ──────────────────────────────────────────────────────────────────────────────

name: PR Check (Quell-Repo)

on:
  workflow_dispatch:
    inputs:
      ref:
        # NUR Branch- oder Tag-NAME. Eine reine Commit-SHA funktioniert hier NICHT
        # (`git clone --depth 1 --branch <sha>` kennt keine SHAs) — ship.sh übergibt
        # ohnehin immer den Branch-Namen.
        description: "Branch/Tag im privaten echo-tauri (z. B. fix/chart-text-squeeze) — keine SHA"
        required: true
        default: "main"

permissions:
  contents: read

concurrency:
  group: pr-check-${{ inputs.ref }}
  cancel-in-progress: true

env:
  SOURCE_REPO: Subunit-UG/echo-app
  # Bewusst NICHT gesetzt: RUST_BACKTRACE; Diagnostik bleibt vertraulich.

jobs:
  # ── Linux-Gate: Frontend-Build + cargo check + cargo test ──────────────────
  # Spiegelt echo-tauri/.github/workflows/pr-check.yml. Default-Features ziehen
  # kein whisper-rs-sys → kein cmake/LLVM nötig, darum schnell.
  linux:
    name: tsc + vite + cargo check + test
    runs-on: ubuntu-latest
    # Kappt einen hängenden Compile. (Wartezeit in der Runner-Queue zählt hier
    # NICHT mit — timeout-minutes läuft erst ab Job-Start.)
    # Builds deliberately compile without a shared private target cache. Allow
    # enough time for a cold dependency graph on the public hosted runner.
    timeout-minutes: 45
    steps:
      # Manueller git clone statt actions/checkout+ssh-key: identisch zu build.yml,
      # dort auf ubuntu/windows/macos/windows-arm bewährt. Ref + Key kommen über
      # `env:` und nicht inline in die Skriptzeile → keine Expression-Injection.
      # Der Schlüssel wird direkt nach dem Clone gelöscht und landet nicht in der
      # git-config (kein Zugriff für npm/cargo-Skripte).
      - name: Quellcode auschecken (privat, read-only Deploy-Key)
        shell: bash
        env:
          SRC_REF: ${{ inputs.ref }}
          DEPLOY_KEY: ${{ secrets.ECHO_TAURI_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          # Enger Zeichensatz für den Ref (Branch/Tag). Kein `..`, kein führendes
          # `-`, keine Shell-Metazeichen. Gleiches Prinzip wie build.yml.
          case "$SRC_REF" in
            -*|*..*|*" "*) echo "::error::ungültiger ref"; exit 1 ;;
          esac
          printf '%s' "$SRC_REF" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._/-]{0,180}$' \
            || { echo "::error::ungültiger ref (Zeichensatz)"; exit 1; }
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/echo_ci"
          chmod 600 "$HOME/.ssh/echo_ci"
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/echo_ci -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone --depth 1 --branch "$SRC_REF" "git@github.com:$SOURCE_REPO.git" src >/dev/null 2>&1 || { echo "::error::private source checkout failed"; exit 1; }
          git -C src config --unset-all core.sshCommand 2>/dev/null || true
          rm -f "$HOME/.ssh/echo_ci"
          echo "ausgecheckt: $SRC_REF → $(git -C src rev-parse --short HEAD)"

      # MUSS direkt nach dem Clone und VOR jedem Build-/Test-Schritt laufen:
      # `::add-mask::` gilt ab hier für den Rest des Jobs. Die Wortliste kommt aus
      # dem PRIVATEN Repo (ci/log-mask-words.txt, eine Zeile pro Wort, `#` = Kommentar),
      # damit dieses öffentliche File die Namen nicht selbst preisgibt.
      #
      # 🔴 FAIL-CLOSED (fehlt die Liste → Job rot). Vorher stand hier `exit 0`.
      # Das ist genau die Sorte Schutz, die sich unbemerkt selbst abschaltet: die
      # Liste lag zu diesem Zeitpunkt ausschliesslich auf einem UNGEPUSHTEN lokalen
      # Branch von echo-tauri — jeder Lauf hätte den Step übersprungen, grün
      # gemeldet und beim ersten roten Test die Kundennamen öffentlich gedruckt.
      # Dasselbe gilt für eine vorhandene, aber komplett auskommentierte Liste.
      # Hinweis: `::add-mask::` ersetzt Treffer im Log durch `***`; die Registrierung
      # selbst wird vom Runner konsumiert. Ausgegeben wird hier nur die ANZAHL.
      - name: Reserve trusted CI paths
        shell: bash
        run: |
          set -euo pipefail
          for path in _release-ci _release-tauri; do
            if [ -e "$path" ] || [ -L "$path" ]; then
              echo "::error::reserved CI path already exists"; exit 1
            fi
          done

      - name: Checkout trusted public CI controls
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: _release-ci
          persist-credentials: false

      - name: Log-Maskierung scharf schalten (fail-closed)
        shell: bash
        run: |
          set -euo pipefail
          f=src/ci/log-mask-words.txt
          if [ ! -f "$f" ]; then
            echo "::error::Maskierungsliste fehlt ($f). Dieser Job schreibt in ein"
            echo "::error::OEFFENTLICHES Log; die Liste bleibt als zusaetzlicher Schutz"
            echo "::error::neben der abgeschirmten Build-/Test-Ausgabe Pflicht. Abbruch."
            echo "::error::Fix: aktuellen main in den geprueften Branch mergen."
            exit 1
          fi
          n=0
          while IFS= read -r w || [ -n "$w" ]; do
            w="${w%%#*}"
            w="$(printf '%s' "$w" | tr -d '[:space:]')"
            [ -z "$w" ] && continue
            # Jede Schreibweise einzeln: add-mask ist case-sensitiv.
            echo "::add-mask::$w"
            echo "::add-mask::$(printf '%s' "$w" | tr '[:upper:]' '[:lower:]')"
            echo "::add-mask::$(printf '%s' "$w" | tr '[:lower:]' '[:upper:]')"
            n=$((n + 1))
          done < "$f"
          if [ "$n" -eq 0 ]; then
            echo "::error::Maskierungsliste ($f) hat keinen einzigen aktiven Eintrag"
            echo "::error::(alles Kommentar?). Ein leerer Schutz ist kein Schutz. Abbruch."
            exit 1
          fi
          echo "Maskierung aktiv für $n Einträge (Werte erscheinen im Log als ***)"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/package-lock.json

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: clippy

      # Private compiler outputs must not enter this public repository's cache.
      # Fork PRs can read caches in the base branch, independently of workflow.

      # libasound2-dev: cpal/alsa-sys (Audio-Capture). libxdo-dev: enigo
      # (synthetische Eingaben). Beide hängen an Default-Features → ohne sie
      # scheitert schon `cargo check`.
      - name: Linux Tauri-Systemdeps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libasound2-dev libxdo-dev

      - name: Frontend bauen (tsc + vite)
        working-directory: src
        shell: bash
        run: |
          bash "$GITHUB_WORKSPACE/_release-ci/scripts/run-confidential.sh" npm ci
          bash "$GITHUB_WORKSPACE/_release-ci/scripts/run-confidential.sh" npm run build

      # Kurzformat bleibt erhalten; die gesamte Diagnostik wird abgeschirmt.
      - name: cargo check + test (BLOCKING)
        working-directory: src/src-tauri
        shell: bash
        run: |
          bash "$GITHUB_WORKSPACE/_release-ci/scripts/run-confidential.sh" cargo check --locked --message-format short
          bash "$GITHUB_WORKSPACE/_release-ci/scripts/run-confidential.sh" cargo test --locked --message-format short

      - name: clippy (advisory)
        working-directory: src/src-tauri
        shell: bash
        run: |
          bash "$GITHUB_WORKSPACE/_release-ci/scripts/run-confidential.sh" cargo clippy --locked --message-format short -- -D warnings || \
            bash "$GITHUB_WORKSPACE/_release-ci/scripts/run-confidential.sh" cargo clippy --locked --message-format short

      # Nur Metadaten in die Zusammenfassung — Ref und SHA sind über den
      # dispatch-Input ohnehin öffentlich. Kein Log-Auszug, kein Quellcode.
      # `inputs.ref` kommt über `env:` und wird NICHT per ${{ }} in die Skriptzeile
      # interpoliert: dieser Step läuft wegen `if: always()` auch dann, wenn die
      # Ref-Validierung im Checkout-Step abgebrochen hat — eine inline-Interpolation
      # wäre hier also eine Expression-Injection an der Validierung vorbei.
      - name: Zusammenfassung
        if: always()
        shell: bash
        env:
          SRC_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          sha="$(git -C src rev-parse --short HEAD 2>/dev/null || echo '?')"
          {
            echo "### Linux-Gate"
            echo ""
            printf -- '- Quelle: `%s` @ `%s`\n' "$SRC_REF" "$sha"
            echo "- Geprüft: tsc + vite · cargo check · cargo test (echo) · clippy (advisory)"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Windows-Gate: kompiliert den #[cfg(windows)]-Code ───────────────────────
  # Spiegelt echo-tauri/.github/workflows/win-check.yml. Echos OS-spezifischer
  # Eingabe-, Capture- und Fenster-Code steckt hinter
  # #[cfg(windows)] — der Linux-Job oben überspringt ihn KOMPLETT. Ohne diesen
  # Job könnte Windows-Code brechen, während die CI grün bleibt.
  # Bewusst nur `cargo check` (kein `cargo test`) — exakt wie win-check.yml:
  # geprüft wird, dass der Windows-Code ÜBERSETZT; die Logik-Tests sind
  # plattformneutral und laufen im Linux-Job.
  windows:
    name: cargo check (Windows, cfg(windows)-Code)
    runs-on: windows-latest
    # 60: Windows-Runner sind beim Kompilieren deutlich langsamer als Linux und
    # der erste Lauf ist cache-kalt (Begründung wie beim Linux-Job).
    timeout-minutes: 60
    steps:
      - name: Quellcode auschecken (privat, read-only Deploy-Key)
        shell: bash
        env:
          SRC_REF: ${{ inputs.ref }}
          DEPLOY_KEY: ${{ secrets.ECHO_TAURI_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          case "$SRC_REF" in
            -*|*..*|*" "*) echo "::error::ungültiger ref"; exit 1 ;;
          esac
          printf '%s' "$SRC_REF" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._/-]{0,180}$' \
            || { echo "::error::ungültiger ref (Zeichensatz)"; exit 1; }
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/echo_ci"
          chmod 600 "$HOME/.ssh/echo_ci"
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/echo_ci -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone --depth 1 --branch "$SRC_REF" "git@github.com:$SOURCE_REPO.git" src >/dev/null 2>&1 || { echo "::error::private source checkout failed"; exit 1; }
          git -C src config --unset-all core.sshCommand 2>/dev/null || true
          rm -f "$HOME/.ssh/echo_ci"

      # Fail-closed, identisch zum Linux-Job (Begründung dort).
      - name: Reserve trusted CI paths
        shell: bash
        run: |
          set -euo pipefail
          for path in _release-ci _release-tauri; do
            if [ -e "$path" ] || [ -L "$path" ]; then
              echo "::error::reserved CI path already exists"; exit 1
            fi
          done

      - name: Checkout trusted public CI controls
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: _release-ci
          persist-credentials: false

      - name: Log-Maskierung scharf schalten (fail-closed)
        shell: bash
        run: |
          set -euo pipefail
          f=src/ci/log-mask-words.txt
          if [ ! -f "$f" ]; then
            echo "::error::Maskierungsliste fehlt ($f). Dieser Job schreibt in ein"
            echo "::error::OEFFENTLICHES Log; die Liste bleibt als zusaetzlicher Schutz"
            echo "::error::neben der abgeschirmten Build-/Test-Ausgabe Pflicht. Abbruch."
            echo "::error::Fix: aktuellen main in den geprueften Branch mergen."
            exit 1
          fi
          n=0
          while IFS= read -r w || [ -n "$w" ]; do
            w="${w%%#*}"
            w="$(printf '%s' "$w" | tr -d '[:space:]')"
            [ -z "$w" ] && continue
            echo "::add-mask::$w"
            echo "::add-mask::$(printf '%s' "$w" | tr '[:upper:]' '[:lower:]')"
            echo "::add-mask::$(printf '%s' "$w" | tr '[:lower:]' '[:upper:]')"
            n=$((n + 1))
          done < "$f"
          if [ "$n" -eq 0 ]; then
            echo "::error::Maskierungsliste ($f) hat keinen einzigen aktiven Eintrag"
            echo "::error::(alles Kommentar?). Ein leerer Schutz ist kein Schutz. Abbruch."
            exit 1
          fi
          echo "Maskierung aktiv für $n Einträge (Werte erscheinen im Log als ***)"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/package-lock.json

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      # Private compiler outputs must not enter this public repository's cache.
      # Fork PRs can read caches in the base branch, independently of workflow.

      # tauri-build validiert die Config und erwartet ein vorhandenes dist/.
      - name: Frontend bauen
        working-directory: src
        shell: bash
        run: |
          bash "$GITHUB_WORKSPACE/_release-ci/scripts/run-confidential.sh" npm ci
          bash "$GITHUB_WORKSPACE/_release-ci/scripts/run-confidential.sh" npm run build

      - name: cargo check (Default-Features → kein whisper.cpp/cmake nötig)
        working-directory: src/src-tauri
        shell: bash
        run: bash "$GITHUB_WORKSPACE/_release-ci/scripts/run-confidential.sh" cargo check --locked --message-format short
